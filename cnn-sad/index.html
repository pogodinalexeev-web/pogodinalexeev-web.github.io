<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2F2748">
<link rel="icon" href="data:,">
<title>Сад свёрточной сети — как картинка превращается в вектор</title>
<style>
  :root{
    --paper:#EFE3C9; --paperShade:#E2D1B0; --ink:#2A1C13; --inkSoft:#5B4331; --inkFaint:#8A735C;
    --warm:#D8742B; --cold:#3B8EE0; --teal:#3C8783; --sun:#F1BF4A; --rose:#C88C86;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"DejaVu Serif",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:#2F2748;color:var(--ink);
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    font-family:var(--sans);overscroll-behavior:none}
  canvas#gl{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none}
  #grain{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.11;mix-blend-mode:multiply;background-size:256px 256px}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(47,39,72,.30) 100%)}
  .paper{background-color:var(--paper);background-size:256px 256px;border:2px solid var(--ink);border-radius:14px 16px 13px 15px;
    box-shadow:4px 5px 0 rgba(42,28,19,.32)}
  #card{position:fixed;z-index:5;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));
    width:min(430px,calc(100vw - 24px));box-sizing:border-box;padding:12px 16px 12px 16px;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s}
  #card .row{display:flex;gap:12px;align-items:flex-start}
  #card .num{flex:0 0 auto;width:38px;height:38px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;
    font:700 20px/1 var(--serif);background:var(--sun);transform:rotate(-4deg)}
  #card h2{margin:1px 22px 4px 0;font:700 20px/1.15 var(--serif);letter-spacing:.01em}
  #card p{margin:0;font:15px/1.35 var(--sans);color:var(--inkSoft)}
  #card .ctrls{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
  #card .ctrls label{font:600 13px/1 var(--sans);color:var(--inkSoft);display:flex;align-items:center;gap:8px;flex:1 1 100%}
  #card .ctrls label b{font:700 18px/1 var(--serif);color:var(--ink);min-width:44px;text-align:right}
  #card .formula{margin-top:8px;font:italic 12px/1.2 var(--serif);color:var(--inkFaint)}
  #card.min .body{display:none}
  #card .tog{position:absolute;right:8px;top:6px;border:0;background:none;font:700 18px var(--sans);color:var(--inkFaint);padding:6px}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:30px;background:transparent;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--paperShade);border:1.5px solid var(--ink)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--warm);border:2px solid var(--ink);margin-top:-11px;box-shadow:2px 2px 0 rgba(42,28,19,.35)}
  input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--paperShade);border:1.5px solid var(--ink)}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--warm);border:2px solid var(--ink)}
  .btn{font:600 14px/1 var(--sans);color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:20px;padding:9px 14px;
    box-shadow:2px 3px 0 rgba(42,28,19,.35);cursor:pointer}
  .btn.on{background:var(--sun)}
  .btn:active{transform:translate(2px,2px);box-shadow:0 1px 0 rgba(42,28,19,.35)}
  #nav{position:fixed;z-index:5;right:max(14px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center}
  #nav .btn{font-size:15px;padding:12px 16px;background-color:var(--paper);background-size:256px}
  #next{background:var(--sun)!important}
  #joy{position:fixed;z-index:4;width:124px;height:124px;border-radius:50%;border:2px dashed rgba(251,246,234,.75);
    background:rgba(42,28,19,.18);display:none;pointer-events:none;transform:translate(-50%,-50%)}
  #knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);box-shadow:2px 3px 0 rgba(42,28,19,.35)}
  #hint{position:fixed;z-index:4;left:50%;bottom:max(84px,calc(env(safe-area-inset-bottom) + 76px));transform:translateX(-50%);
    font:600 14px/1.3 var(--sans);color:#FBF6EA;text-align:center;text-shadow:0 1px 3px rgba(20,14,30,.8);transition:opacity 1s;pointer-events:none;width:92vw}
  #hint span{display:inline-block;margin:0 8px}
  #joyzone{position:fixed;z-index:3;left:14px;bottom:max(18px,env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;
    border:2px dashed rgba(251,246,234,.45);pointer-events:none;display:none}
  body.touch #joyzone{display:block}
  #card .info{font:600 13px/1.35 var(--sans);color:var(--ink);flex:1 1 100%;min-height:1.35em}
  #card .info i{font-family:var(--serif);color:var(--inkSoft)}
  #card{max-height:calc(100dvh - 110px);overflow-y:auto;-webkit-overflow-scrolling:touch}
  #fps{position:fixed;right:6px;top:4px;z-index:9;font:11px monospace;color:#fff;opacity:.5;display:none}
  @media (max-width:560px){
    #card{padding:9px 11px 8px 11px;border-radius:12px}
    #card h2{font-size:16px}
    #card p{font-size:13px;line-height:1.3}
    #card .ctrls{margin-top:6px;gap:6px 8px}
    #card .ctrls .btn{padding:7px 11px;font-size:13px}
    #card .formula{margin-top:4px;font-size:11px}
    #card .num{width:32px;height:32px;font-size:17px}
    #nav .btn{font-size:14px;padding:11px 13px}
  }
  @media (max-height:520px) and (orientation:landscape){
    #card{width:min(370px,44vw);padding:8px 11px 8px 11px;max-height:calc(100dvh - 24px)}
    #card h2{font-size:16px}
    #card p{font-size:13px;line-height:1.3}
    #card .ctrls{margin-top:6px;gap:6px 8px}
    #card .ctrls .btn{padding:6px 10px;font-size:13px}
    #card .ctrls label{font-size:12px}
    #card .info{font-size:12px}
    #card .formula{margin-top:4px;font-size:11px}
    #card .num{width:30px;height:30px;font-size:16px}
    #nav .btn{font-size:14px;padding:10px 13px}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div>
<div id="grain"></div>
<div id="card" class="paper">
  <button class="tog" id="tog" aria-label="свернуть">–</button>
  <div class="row"><div class="num" id="cnum">◫</div><div><h2 id="ctitle">Сад свёрточной сети</h2><div class="body"><p id="ctext"></p></div></div></div>
  <div class="body"><div class="ctrls" id="cctrls"></div><div class="formula" id="cformula"></div></div>
</div>
<div id="nav"><button class="btn" id="snd">♪ звук</button><button class="btn" id="next">к станции 1 →</button></div>
<div id="joyzone"></div>
<div id="joy"><div id="knob"></div></div>
<div id="hint"></div>
<div id="fps"></div>
<script type="module">
import * as THREE from './lib/three.module.js';
import * as CNN from './cnn.js';
THREE.ColorManagement.enabled = false;

// ---------------------------------------------------------------------------
// palette (procedural-film house palette + subject tints)
// ---------------------------------------------------------------------------
const PAL = {
  paper: '#EFE3C9', paperShade: '#E2D1B0', paperDeep: '#CDB58C',
  stripeCream: '#F2E7CF', stripeYellow: '#EFDCA3', stripeApricot: '#F0D9B5', stripeSage: '#DCE3CC', stripeSky: '#C9D3D2',
  ink: '#2A1C13', inkSoft: '#5B4331', inkFaint: '#8A735C',
  tan: '#C8A47A', ochre: '#C38F2E', rose: '#C88C86', duskRose: '#E3B1A1', sage: '#94A47F',
  teal: '#3C8783', tealDeep: '#285F5D', sun: '#F1BF4A', nightSky: '#4E3F6E', night: '#2F2748', white: '#FBF6EA',
  orange: '#D8742B', leaf: '#6E8F4F', wood: '#A8784C', red: '#BF3F2C', dusk: '#5A4878',
  navy: '#0B1230', navyLight: '#18234D', grid: '#3A4A86', lavender: '#C8C1EF', lineWhite: '#EEF0FF', paleBlue: '#9CC2EA', glow: '#FFF3DC',
  annBlue: '#3B8EE0', annMagenta: '#E43D8C', annYellow: '#EAB530',
  warm: '#E0782E', warmLight: '#F1BF4A', cold: '#3E8FC4', coldLight: '#9CC2EA', water: '#3C8783', waterLight: '#8CC3BB',
};
const col = (h) => new THREE.Color(h);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
function mulberry(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hash1(i, s) { let h = Math.imul((i | 0) ^ Math.imul(s | 0, 0x9E3779B1), 0x85EBCA6B); h ^= h >>> 13; h = Math.imul(h, 0xC2B2AE35); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function noise1(x, s = 0) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash1(i, s), hash1(i + 1, s), u) * 2 - 1; }
const fmt = (v, d = 2) => v.toFixed(d).replace('.', ',').replace('-', '−');

const IS_TOUCH = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
if (IS_TOUCH) document.body.classList.add('touch');
const Q = new URLSearchParams(location.search);

// ---------------------------------------------------------------------------
// renderer
// ---------------------------------------------------------------------------
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: Q.has('shot') });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
const DPR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(DPR);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.08, 400);
camera.rotation.order = 'YXZ';

// shared uniforms (same objects referenced from every material)
const SH = {
  uTime: { value: 0 },
  uFogColor: { value: col('#EDCFAE') },
  uFogDensity: { value: 0.0095 },
  uLightDir: { value: new THREE.Vector3(0.25, 0.9, 0.38).normalize() },
  uInk: { value: col(PAL.ink) },
  uRes: { value: new THREE.Vector2(1, 1) },
  uDpr: { value: DPR },
};

const GLSL_COMMON = /* glsl */`
  uniform float uTime; uniform vec3 uFogColor; uniform float uFogDensity; uniform vec3 uLightDir; uniform vec3 uInk; uniform vec2 uRes; uniform float uDpr;
  float hash21(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
  float fogAmt(vec3 w){ float d = length(w - cameraPosition); return 1.0 - exp(-pow(d*uFogDensity, 1.5)); }
`;

// ---------------------------------------------------------------------------
// ink material: flat paper colour, cool shadow, screen-space hatching,
// optional uv border (pixel-constant ink edge), grain, fog
// ---------------------------------------------------------------------------
const INK_VS = /* glsl */`
  varying vec3 vN; varying vec3 vW; varying vec2 vUv; varying vec3 vCol;
  void main(){
    mat4 m = modelMatrix;
    #ifdef USE_INSTANCING
      m = m * instanceMatrix;
    #endif
    vCol = vec3(1.0);
    #ifdef USE_INSTANCING_COLOR
      vCol = instanceColor;
    #endif
    vec4 w = m * vec4(position, 1.0);
    vW = w.xyz; vN = normalize(mat3(m) * normal); vUv = uv;
    gl_Position = projectionMatrix * viewMatrix * w;
  }`;
const INK_FS = /* glsl */`
  ${GLSL_COMMON}
  uniform vec3 uColor; uniform sampler2D uMap; uniform float uUseMap; uniform vec2 uRepeat;
  uniform float uHatch, uBorder, uFlat, uOpacity, uAlphaTest, uFog, uEmit;
  varying vec3 vN; varying vec3 vW; varying vec2 vUv; varying vec3 vCol;
  void main(){
    vec3 base = uColor * vCol; float a = uOpacity;
    if (uUseMap > 0.5) { vec4 t = texture2D(uMap, vUv * uRepeat); base *= t.rgb; a *= t.a; }
    if (a < uAlphaTest) discard;
    vec3 N = normalize(vN); if (!gl_FrontFacing) N = -N;
    float l = dot(N, uLightDir) * 0.5 + 0.5;
    vec3 V = normalize(cameraPosition - vW);
    vec3 shade = base * vec3(0.70, 0.66, 0.80);
    float lit = mix(smoothstep(0.24, 0.52, l), 1.0, uFlat);
    vec3 c = mix(shade, base, lit);
    float rim = pow(1.0 - max(dot(N, V), 0.0), 3.0);
    c += vec3(0.22, 0.13, 0.05) * rim * (1.0 - uFlat) * 0.5;
    float px = 1.0 / uDpr;
    float s1 = (gl_FragCoord.x + gl_FragCoord.y) * px / 4.5;
    float line1 = 1.0 - smoothstep(0.2, 0.5, abs(fract(s1) - 0.5) * 2.0);
    float s2 = (gl_FragCoord.x - gl_FragCoord.y) * px / 4.5;
    float line2 = 1.0 - smoothstep(0.2, 0.5, abs(fract(s2) - 0.5) * 2.0);
    float amt1 = (1.0 - smoothstep(0.26, 0.46, l)) * (1.0 - uFlat);
    float amt2 = (1.0 - smoothstep(0.06, 0.24, l)) * (1.0 - uFlat);
    c = mix(c, uInk, uHatch * (line1 * amt1 * 0.30 + line2 * amt2 * 0.25));
    if (uBorder > 0.0) {
      vec2 fw = max(fwidth(vUv), vec2(1e-5)); vec2 d = min(vUv, 1.0 - vUv) / fw;
      vec2 bw = min(vec2(uBorder * uDpr), 0.2 / fw);
      float ex = smoothstep(bw.x - 0.6, bw.x + 0.6, d.x), ey = smoothstep(bw.y - 0.6, bw.y + 0.6, d.y);
      c = mix(uInk, c, min(ex, ey));
    }
    c = mix(c, base, uEmit);
    c += (hash21(floor(gl_FragCoord.xy * px)) - 0.5) * 0.05;
    c = mix(c, uFogColor, fogAmt(vW) * uFog);
    gl_FragColor = vec4(c, a);
  }`;
function inkMat(o = {}) {
  const m = new THREE.ShaderMaterial({
    uniforms: Object.assign({
      uColor: { value: col(o.color || '#ffffff') },
      uMap: { value: o.map || null }, uUseMap: { value: o.map ? 1 : 0 },
      uRepeat: { value: new THREE.Vector2(...(o.repeat || [1, 1])) },
      uHatch: { value: o.hatch ?? 1 }, uBorder: { value: o.border || 0 }, uFlat: { value: o.flat || 0 },
      uOpacity: { value: o.opacity ?? 1 }, uAlphaTest: { value: o.alphaTest || 0 }, uFog: { value: o.fog ?? 1 }, uEmit: { value: o.emit || 0 },
    }, SH),
    vertexShader: INK_VS, fragmentShader: INK_FS,
    transparent: !!o.transparent, side: o.side ?? THREE.FrontSide, depthWrite: o.depthWrite ?? true,
  });
  m.extensions = { derivatives: true };
  return m;
}

// inverted-hull ink outline
const OUT_VS = /* glsl */`
  uniform float uOut; varying vec3 vW;
  void main(){
    mat4 m = modelMatrix;
    #ifdef USE_INSTANCING
      m = m * instanceMatrix;
    #endif
    vec4 w = m * vec4(position, 1.0);
    vec3 n = normalize(mat3(m) * normal);
    float d = length(cameraPosition - w.xyz);
    w.xyz += n * uOut * (0.7 + d * 0.035);
    vW = w.xyz;
    gl_Position = projectionMatrix * viewMatrix * w;
  }`;
const OUT_FS = /* glsl */`${GLSL_COMMON} uniform vec3 uColor; varying vec3 vW;
  void main(){ gl_FragColor = vec4(mix(uColor, uFogColor, fogAmt(vW)), 1.0); }`;
const outlineMats = {};
function outlineMat(w = 0.018, c = PAL.ink) {
  const k = w + c;
  if (!outlineMats[k]) outlineMats[k] = new THREE.ShaderMaterial({ uniforms: Object.assign({ uOut: { value: w }, uColor: { value: col(c) } }, SH), vertexShader: OUT_VS, fragmentShader: OUT_FS, side: THREE.BackSide });
  return outlineMats[k];
}
function outline(mesh, w, c) { const o = new THREE.Mesh(mesh.geometry, outlineMat(w, c)); o.raycast = () => {}; mesh.add(o); return mesh; }
function mesh(geo, mat, parent, pos, rot, out) {
  const m = new THREE.Mesh(geo, mat);
  if (pos) m.position.set(...pos);
  if (rot) m.rotation.set(...rot);
  if (out) outline(m, out === true ? 0.018 : out);
  if (parent) parent.add(m);
  return m;
}

// ---------------------------------------------------------------------------
// fat hand-drawn lines: screen-facing ribbons, world-space width, pressure
// variation, boil (the hand-drawn shimmer), dashes, draw-on progress, glow
// ---------------------------------------------------------------------------
const LINE_VS = /* glsl */`
  ${GLSL_COMMON}
  attribute vec3 prev; attribute vec3 next; attribute float side; attribute float lu; attribute float wv;
  uniform float uWidth, uMinPx, uBoil;
  varying float vU; varying float vSide; varying vec3 vW;
  void main(){
    mat4 mvp = projectionMatrix * viewMatrix * modelMatrix;
    vec4 c = mvp * vec4(position, 1.0); vec4 cp = mvp * vec4(prev, 1.0); vec4 cn = mvp * vec4(next, 1.0);
    float asp = uRes.x / uRes.y;
    vec2 s = c.xy / max(abs(c.w), 1e-4), sp = cp.xy / max(abs(cp.w), 1e-4), sn = cn.xy / max(abs(cn.w), 1e-4);
    s.x *= asp; sp.x *= asp; sn.x *= asp;
    vec2 d1 = s - sp, d2 = sn - s;
    vec2 t = vec2(0.0);
    if (dot(d1, d1) > 1e-12) t += normalize(d1);
    if (dot(d2, d2) > 1e-12) t += normalize(d2);
    if (dot(t, t) < 1e-12) t = vec2(1.0, 0.0);
    t = normalize(t);
    vec2 nr = vec2(-t.y, t.x);
    float boil = 1.0 + uBoil * 0.22 * sin(lu * 61.0 + floor(uTime * 8.0) * 2.37);
    float hw = max(uWidth * 0.5 * projectionMatrix[1][1] * wv * boil, uMinPx * uDpr / uRes.y * c.w);
    vec2 off = nr * hw * side; off.x /= asp;
    c.xy += off;
    gl_Position = c; vU = lu; vSide = side; vW = (modelMatrix * vec4(position, 1.0)).xyz;
  }`;
const LINE_FS = /* glsl */`
  ${GLSL_COMMON}
  uniform vec3 uColor; uniform float uOpacity, uDash, uDashRatio, uProgress, uGlow, uFog, uDashShift;
  varying float vU; varying float vSide; varying vec3 vW;
  void main(){
    if (vU > uProgress) discard;
    if (uDash > 0.0 && fract(vU * uDash - uDashShift) > uDashRatio) discard;
    float e = abs(vSide);
    float a = uOpacity;
    float f = fogAmt(vW) * uFog;
    if (uGlow > 0.5) { a *= pow(max(1.0 - e, 0.0), 1.8) * (1.0 - f); gl_FragColor = vec4(uColor, a); return; }
    gl_FragColor = vec4(mix(uColor, uFogColor, f), a);
  }`;
class Line {
  constructor(max, o = {}) {
    this.max = max;
    const g = new THREE.BufferGeometry();
    const n = max * 2;
    this.pos = new Float32Array(n * 3); this.prev = new Float32Array(n * 3); this.next = new Float32Array(n * 3);
    const side = new Float32Array(n), wv = new Float32Array(n);
    this.lu = new Float32Array(n);
    const seed = o.seed ?? Math.floor(Math.random() * 1000);
    for (let i = 0; i < max; i++) {
      side[i * 2] = -1; side[i * 2 + 1] = 1;
      const w = o.pressure === 0 ? 1 : 0.8 + 0.4 * (noise1(i * 0.09, seed) * 0.5 + 0.5);
      wv[i * 2] = wv[i * 2 + 1] = w;
    }
    g.setAttribute('position', new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('prev', new THREE.BufferAttribute(this.prev, 3).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('next', new THREE.BufferAttribute(this.next, 3).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('side', new THREE.BufferAttribute(side, 1));
    g.setAttribute('wv', new THREE.BufferAttribute(wv, 1));
    g.setAttribute('lu', new THREE.BufferAttribute(this.lu, 1).setUsage(THREE.DynamicDrawUsage));
    this.index = new Uint32Array((max - 1) * 6);
    g.setIndex(new THREE.BufferAttribute(this.index, 1).setUsage(THREE.DynamicDrawUsage));
    this.geo = g;
    const glow = !!o.glow;
    this.mat = new THREE.ShaderMaterial({
      uniforms: Object.assign({
        uColor: { value: col(o.color || PAL.ink) }, uWidth: { value: o.width ?? 0.03 }, uMinPx: { value: o.minPx ?? 1.0 },
        uOpacity: { value: o.opacity ?? 1 }, uDash: { value: 0 }, uDashRatio: { value: o.dashRatio ?? 0.55 }, uDashShift: { value: 0 },
        uProgress: { value: 1.01 }, uGlow: { value: glow ? 1 : 0 }, uBoil: { value: o.boil ?? 1 }, uFog: { value: o.fog ?? 1 },
      }, SH),
      vertexShader: LINE_VS, fragmentShader: LINE_FS,
      transparent: glow || (o.opacity ?? 1) < 1, depthWrite: !glow && (o.opacity ?? 1) >= 1,

  update(st, dt) {

  controls(box) {

});

// ===========================================================================
// 2. CONVOLUTION: a 3×3 window crawls over the picture

const KERNELS = [
  ['верт. края', [-1, 0, 1, -2, 0, 2, -1, 0, 1]],

makeStation(1, {
  title: 'Свёртка: окошко 3×3 бежит по картинке',
  text: 'Берём яркость каждой клетки. Окошко 3 на 3 (ядро) несёт свои девять чисел. На каждом шаге девять чисел картинки умножаются на девять чисел ядра и складываются. Сумма падает клеткой в новую грядку. Это и есть свёртка (convolution). Разные ядра замечают разное: края, пятна, резкость.',
  short: 'Окошко 3×3 (ядро) несёт девять чисел. На каждом шаге: 9 умножений и сумма, она падает клеткой в новую грядку. Это свёртка (convolution).',
  formula: 'новая клетка = Σ (клетка картинки × число ядра), 9 слагаемых',

  build(st) {

    Object.assign(st, { N, M, cell, Y0, XI, XO, ZL, HI, ker: 0, pos: 0, acc: 0, play: true, speed: 6, hold: 0, drawT: 0 });

    mesh(new THREE.BoxGeometry(7.4, Y0, 3.0), woodMat, G, [0, Y0 / 2, 0], null, 0.014);
    const top = paperCanvas(1024, 416, PAL.paperShade, { seed: 14, vignette: 0.1 });
    mesh(new THREE.PlaneGeometry(7.2, 2.9), inkMat({ map: tex(top), flat: 1, hatch: 0 }), G, [0, Y0 + 0.003, 0], [-Math.PI / 2, 0, 0]);
    // output level: a sheet of water on four legs

    const sheet = mesh(new THREE.PlaneGeometry(S + 0.12, S + 0.12), new THREE.MeshBasicMaterial({ color: col(PAL.waterLight), transparent: true, opacity: 0.33, depthWrite: false, side: THREE.DoubleSide }), G, [XO, ZL, 0], [-Math.PI / 2, 0, 0]);
    sheet.renderOrder = 6; sheet.raycast = () => {};
    const r = S / 2 + 0.06;
    new Line(8, { pts: [V3(XO - r, ZL, -r), V3(XO + r, ZL, -r), V3(XO + r, ZL, r), V3(XO - r, ZL, r), V3(XO - r, ZL, -r)], width: 0.025, color: PAL.tealDeep, parent: G });
    for (const [a, b] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) mesh(new THREE.BoxGeometry(0.05, ZL - Y0, 0.05), woodMat, G, [XO + a * r, Y0 + (ZL - Y0) / 2, b * r], null, 0.01);
    st.inCols = new Cols(G, N * N, { raycast: false, border: 0.45 }); st.outCols = new Cols(G, M * M, { raycast: false, border: 0.5 });
    st.win = windowBox(G, PAL.sun);
    st.drop = new Line(2, { width: 0.02, color: PAL.orange, dash: 0.08, parent: G, pressure: 0 });
    st.outGlow = glowSprite(0.7, 0.9); G.add(st.outGlow);
    st.bd = board(G, 5.4, 1.75, 1350, 438, [0, 2.75, -1.75], 0, 33);
    tag(G, 'яркость картинки', [XI, 0.62, 1.75], { w: 1.4, fs: 50, seed: 3 });
    tag(G, 'новая грядка', [XO, 0.62, 1.75], { w: 1.4, fs: 50, seed: 4 });
    sign(st, [-5.4, 0, 2.6], faceTo([-5.4, 0, 2.6], [0, 0, 7.2]), { title: 'Свёртка', body: ['Окошко 3×3 (ядро) ползёт по картинке.', 'Девять умножений, сумма, новая клетка.'], formula: 'Σ картинка × ядро' });
    st.rects.push([-3.8, 3.8, -1.6, 1.6], [-2.2, 2.2, -1.95, -1.55]);

      st.scale = 0.55 / absMax(st.out);
      for (let p = 0; p < N * N; p++) { const i = Math.floor(p / N), j = p % N, v = b[p]; st.inCols.col(p, XI + (j - N / 2 + 0.5) * cell, Y0, (i - N / 2 + 0.5) * cell, cell * 0.9, v * HI + 0.01); const c = mix3([0.22, 0.17, 0.14], [0.98, 0.95, 0.88], v); st.inCols.rgb(p, ...c); }
      st.inCols.done();
      st.pos = 0; st.hold = 0; st.hl = null; st.clearOut(); st.place(0);
    };
    st.clearOut = () => { for (let q = 0; q < M * M; q++) { const i = Math.floor(q / M), j = q % M; st.outCols.col(q, XO + (j - M / 2 + 0.5) * cell, ZL, (i - M / 2 + 0.5) * cell, cell * 0.9, 0); st.outCols.rgb(q, ...C_PAPER); } st.outCols.done(); };

        g.fillStyle = PAL.inkSoft; g.font = `700 34px ${SANS}`; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
        g.fillText(`ШАГ ${Math.min(st.pos, M * M)} ИЗ ${M * M}  ·  ЯДРО «${KERNELS[st.ker][0].toUpperCase()}»`, 50, 70);
        const grid = (x0, vals, colorFn, title) => {
          g.font = `italic 30px ${SERIF}`; g.fillStyle = PAL.inkSoft; g.textAlign = 'center'; g.fillText(title, x0 + 150, 118);
          for (let a = 0; a < 3; a++) for (let c = 0; c < 3; c++) {
            const v = vals[a * 3 + c], x = x0 + c * 100, y = 136 + a * 92;
            g.fillStyle = colorFn(v); g.fillRect(x + 3, y + 3, 94, 86);
            g.fillStyle = PAL.ink; g.font = `600 ${Math.abs(v) < 1 && v !== 0 && String(fmt(v, 2)).length > 4 ? 36 : 40}px ${SANS}`; g.fillText(fmt(v, Number.isInteger(v) ? 0 : 2), x + 50, y + 59);
          }

        g.fillStyle = PAL.ink; g.font = `700 80px ${SERIF}`; g.textAlign = 'center'; g.fillText('×', 410, 300); g.fillText('=', 840, 300);
        const v = st.out[q];
        const c = valRGB(v * st.scale / 0.55);

        g.fillStyle = PAL.ink; g.font = `700 110px ${SERIF}`; g.fillText(fmt(v, 2), 1095, 300);
        g.font = `italic 30px ${SERIF}`; g.fillStyle = PAL.inkSoft; g.fillText('9 умножений, сумма', 1095, 118); g.fillText('→ клетка новой грядки', 1095, 395);

  },
});

makeStation(2, {
  title: 'Много ядер: стопка карт, потом выпрямитель',
  text: 'В сети ядер не одно, а много, и каждое смотрит на все три цвета сразу. Здесь четыре ядра, у каждого своя карта признаков (feature map): одна ловит вертикальные края, другая горизонтальные, третья рыжее, четвёртая тёмные точки. Синие столбики ушли ниже нуля. Выпрямитель (ReLU) срезает всё отрицательное в ноль: вода ниже уровня земли просто уходит.',

    for (const [a, b] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) mesh(new THREE.BoxGeometry(0.06, Ys[3] + 0.6, 0.06), woodMat, G, [0.2 + a * r, (Ys[3] + 0.6) / 2, b * r * Math.cos(TILT) * 0.9], null, 0.01);

function mapCanvas(arr, n, scale, chan = -1) {
  const c = mkCanvas(n, n), g = c.getContext('2d'), id = g.createImageData(n, n);
  for (let p = 0; p < n * n; p++) {
    const v = arr[p] * scale, rgb = chan >= 0 ? chanRGB(chan, arr[p]) : valRGB(v);
    id.data[p * 4] = rgb[0] * 255; id.data[p * 4 + 1] = rgb[1] * 255; id.data[p * 4 + 2] = rgb[2] * 255; id.data[p * 4 + 3] = 255;
  }
  g.putImageData(id, 0, 0); return c;
}

    st.cubeTag = tag(G, '3×3×16', [TX, 4.0, TZ], { w: 1.0, cw: 420, ch: 120, fs: 58, seed: 81 });
    st.vecTag = tag(G, 'вектор: 144 числа', [0, 2.1, 0.6], { w: 1.9, cw: 640, ch: 120, fs: 56, seed: 82, bg: PAL.stripeYellow });
    sign(st, [-5.2, 0, 3.4], faceTo([-5.2, 0, 3.4], [0, 0, 7.3]), { title: 'Расплющить', body: ['16 карт по 3×3 раскладываем в строку.', 'Получается вектор: 144 числа подряд.'], formula: '3·3·16 = 144' });
    st.rects.push([-0.7, 0.7, -1.6, -0.2]);
    hitBox(st, 7, 4, 3, [0, 1.5, 0]);
    st.refresh = () => { st.v = FWD.v; st.sc = 1 / absMax(st.v); st.dirty = true; };
    st.refresh();
    if (Q.get('flat') === '1') st.k = st.target = 1;
  },
  update(st, dt) {
    if (st.dist > 40) return;
    if (active === 5 && !st.autoDone) { st.autoT += dt; if (st.autoT > 1.5) { st.autoDone = true; st.setFlat && st.setFlat(true); } }
    const d = st.target - st.k;
    if (Math.abs(d) > 1e-4) { st.k += Math.sign(d) * Math.min(Math.abs(d), dt * 0.38); st.dirty = true; }
    if (!st.dirty) return; st.dirty = false;
    const { NV } = st;
    for (let q = 0; q < NV; q++) {
      const t0 = q / NV * 0.55, t = ease(clamp((st.k - t0) / 0.45, 0, 1));
      const h = st.home[q], s = st.slot[q], v = st.v[q] * st.sc, m = Math.floor(q / 9);
      const x = lerp(h[0], s[0], t), z = lerp(h[2], s[2], t), y = lerp(h[1], s[1], t) + Math.sin(t * Math.PI) * 1.2;
      const hh = lerp(0.17, 0.04 + v * 1.0, t), ww = lerp(0.17, 0.038, t);
      st.cols.set(q, x, y, z, ww, hh, lerp(0.17, 0.11, t));
      const base = valRGB(0.15 + v * 0.85), tint = m % 2 ? [0.30, 0.56, 0.60] : [0.88, 0.55, 0.22];
      st.cols.rgb(q, ...mix3(base, tint, 0.35 + 0.25 * (1 - v)));
    }
    st.cols.done();
    const k = st.k;
    st.mapTags.forEach((t) => (t.visible = k > 0.95)); st.dots.visible = k > 0.95; st.vecTag.visible = k > 0.95; st.cubeTag.visible = k < 0.1;
  },
  controls(box) {
    const st = this;
    box.innerHTML = `<button class="btn" data-f>расплющить</button><div class="info">первые 9 чисел из карты 1, следующие 9 из карты 2, и так до карты 16</div>`;
    const b = box.querySelector('[data-f]');
    st.setFlat = (on) => { st.target = on ? 1 : 0; b.textContent = on ? 'собрать обратно' : 'расплющить'; b.classList.toggle('on', on); AUDIO.chime(on); };
    b.addEventListener('click', () => { st.autoDone = true; st.setFlat(st.target < 0.5); });
    if (st.target > 0.5) { b.textContent = 'собрать обратно'; b.classList.add('on'); }
  },
});

// shared rig for 7 and 8: vector row → threads → four lanterns
// ===========================================================================
const LAMP_X = [-2.55, -0.85, 0.85, 2.55];
function answerRig(st, o = {}) {
  const G = st.g, NV = 144, VZ = o.vz ?? 0.9, LZ = o.lz ?? -1.6, X0 = -3.3, X1 = 3.3, VY = 0.55, POLE = 3.7;
  const rig = { NV, VZ, LZ, VY, xs: [], lampY: [1, 1, 1, 1], lampT: [1, 1, 1, 1], probs: [0.25, 0.25, 0.25, 0.25], flow: 0, err: 0 };
  mesh(new THREE.BoxGeometry(X1 - X0 + 0.3, VY, 0.34), woodMat, G, [0, VY / 2, VZ], null, 0.014);
  for (let j = 0; j < NV; j++) rig.xs.push(X0 + (X1 - X0) * (j + 0.5) / NV);
  rig.cols = new Cols(G, NV, { raycast: false, border: 0.6 });
  rig.lamps = LAMP_X.map((x, k) => {
    mesh(new THREE.CylinderGeometry(0.05, 0.065, POLE, 8), postMat, G, [x, POLE / 2, LZ], null, 0.012);
    mesh(new THREE.CylinderGeometry(0.3, 0.36, 0.12, 20), inkMat({ color: PAL.inkSoft }), G, [x, 0.06, LZ], null, 0.012);
    const mat = inkMat({ color: '#FFD98A', emit: 0.9, flat: 1, hatch: 0 });
    const globe = mesh(new THREE.SphereGeometry(0.26, 18, 14), mat, G, [x, 1, LZ + 0.12], null, 0.014); globe.scale.y = 1.25;
    const halo = glowSprite(2.6, 0.8); globe.add(halo);
    const t = tag(G, CNN.CLASSES[k], [x, POLE + 0.42, LZ], { w: 1.25, cw: 470, ch: 175, seed: 90 + k });
    return { globe, halo, mat, t, x };
  });
  rig.pos = [0, 1, 2, 3].map(() => new Line(300, { width: 0.012, color: '#E07A2E', opacity: 0.5, dash: 0.16, dashRatio: 0.6, parent: G, pressure: 0, boil: 0 }));
  rig.neg = [0, 1, 2, 3].map(() => new Line(300, { width: 0.012, color: '#3E7FB8', opacity: 0.5, dash: 0.16, dashRatio: 0.6, parent: G, pressure: 0, boil: 0 }));
  rig.set = (v, W, probs) => {
    rig.v = v; rig.W = W; rig.probs = probs;
    const sc = 0.9 / absMax(v);
    for (let j = 0; j < NV; j++) { rig.cols.set(j, rig.xs[j], VY, VZ, 0.036, 0.01 + v[j] * sc, 0.16); rig.cols.rgb(j, ...valRGB(0.12 + v[j] * sc * 0.88)); }
    rig.cols.done(); rig.vsc = sc;
    probs.forEach((p, k) => { rig.lampT[k] = 1.0 + p * (POLE - 1.35); });
    const best = probs.indexOf(Math.max(...probs));
    rig.lamps.forEach((L, k) => L.t.userData.set(`${CNN.CLASSES[k]}\n${Math.round(probs[k] * 100)}%`, k === best ? PAL.ink : PAL.inkFaint));
    rig.best = best; rig.dirtyThreads = true;
  };
  rig.update = (dt) => {
    let moving = false;
    rig.lamps.forEach((L, k) => {
      const d = rig.lampT[k] - rig.lampY[k]; if (Math.abs(d) > 1e-3) { rig.lampY[k] += d * (1 - Math.exp(-dt * 3)); moving = true; }
      L.globe.position.y = rig.lampY[k];
      const p = rig.probs[k];
      L.halo.material.opacity = 0.1 + 0.9 * p; L.halo.scale.setScalar(1.0 + 3.4 * p);
      L.mat.uniforms.uColor.value.setRGB(0.80 + 0.2 * p, 0.74 + 0.14 * p, 0.62 - 0.12 * p);
    });
    if (moving || rig.dirtyThreads) rig.threads();
    rig.flow += dt * (rig.err > 0 ? -2.2 : 0.9);
    rig.err = Math.max(0, rig.err - dt);
    for (const l of [...rig.pos, ...rig.neg]) l.mat.uniforms.uDashShift.value = rig.flow;
  };
  rig.threads = () => {
    rig.dirtyThreads = false;
    if (!rig.v) return;
    let mx = 1e-6; for (let k = 0; k < 4; k++) for (let j = 0; j < NV; j++) mx = Math.max(mx, Math.abs(rig.W[k * NV + j] * rig.v[j]));
    for (let k = 0; k < 4; k++) {
      const P = [], Nn = [], gp = V3(LAMP_X[k], rig.lampY[k] - 0.2, LZ + 0.12);
      for (let j = 0; j < NV; j++) {
        const c = rig.W[k * NV + j] * rig.v[j]; if (Math.abs(c) < mx * 0.06) continue;
        const a = V3(rig.xs[j], VY + 0.01 + rig.v[j] * rig.vsc, VZ);
        (c > 0 ? P : Nn).push([a, V3((a.x + gp.x) / 2, Math.max(a.y, gp.y) + 0.35, (a.z + gp.z) / 2), gp]);
      }
      rig.pos[k].setStrips(P.slice(0, 99)); rig.neg[k].setStrips(Nn.slice(0, 99));
      const on = k === rig.best;
      rig.pos[k].mat.uniforms.uOpacity.value = on ? 0.85 : 0.28; rig.neg[k].mat.uniforms.uOpacity.value = on ? 0.7 : 0.22;
      rig.pos[k].mat.uniforms.uWidth.value = rig.neg[k].mat.uniforms.uWidth.value = on ? 0.016 : 0.009;
      rig.pos[k].mat.transparent = rig.neg[k].mat.transparent = true; rig.pos[k].mat.depthWrite = rig.neg[k].mat.depthWrite = false;
      const errCol = rig.err > 0;
      rig.pos[k].mat.uniforms.uColor.value.set(errCol ? '#D2453A' : '#E07A2E');
      rig.neg[k].mat.uniforms.uColor.value.set(errCol ? '#D2453A' : '#3E7FB8');
    }
  };
  return rig;
}
function softmaxBoard(bd, F, title) {
  bd.draw((g, w, h) => {
    g.fillStyle = PAL.inkSoft; g.font = `700 30px ${SANS}`; g.textAlign = 'left'; g.fillText(title, 44, 64);
    g.font = `italic 26px ${SERIF}`; g.fillText('голоса', 250, 110); g.fillText('eˣ', 445, 110); g.fillText('доля', 600, 110);
    const best = F.probs.indexOf(Math.max(...F.probs)), se = F.exps.reduce((a, b) => a + b, 0);
    CNN.CLASSES.forEach((c, k) => {
      const y = 170 + k * 82;
      if (k === best) { g.fillStyle = rgba(PAL.sun, 0.55); g.fillRect(36, y - 52, w - 72, 74); }
      g.fillStyle = PAL.ink; g.font = `${k === best ? 700 : 500} 40px ${SERIF}`; g.fillText(c, 50, y);
      g.font = `500 36px ${SANS}`; g.textAlign = 'right';
      g.fillText(fmt(F.logits[k], 1), 340, y); g.fillText(fmt(F.exps[k], F.exps[k] < 10 ? 3 : 1), 540, y);
      g.font = `700 40px ${SANS}`; g.fillText(fmt(F.probs[k], 2), 700, y); g.textAlign = 'left';
    });
    const y = 170 + 4 * 82; quickStroke(g, [[50, y - 50], [w - 50, y - 50]], 3, PAL.ink);
    g.font = `600 34px ${SANS}`; g.fillStyle = PAL.inkSoft; g.fillText('сумма', 50, y); g.textAlign = 'right'; g.fillText(fmt(se, 1), 540, y);
    g.fillStyle = PAL.ink; g.font = `700 40px ${SANS}`; g.fillText(fmt(F.probs.reduce((a, b) => a + b, 0), 2), 700, y);
  });
}

makeStation(7, {
  title: 'Учёба: ошибка бежит назад',
  text: 'Новичок со случайными весами отвечает наугад. Показываем ему 20 рисунков с правильными ответами. Ошибка бежит от фонарей назад по нитям и через все слои до самых первых ядер, и каждое число чуть подкручивается туда, где ошибка меньше. Шаг за шагом нужный фонарь растёт. Это обучение (backpropagation).',
  short: 'Новичок отвечает наугад. Ошибка бежит назад по нитям до самых ядер и чуть подкручивает каждое число. Шаг за шагом нужный фонарь растёт (backpropagation).',
  formula: 'вес ← вес − шаг × (как ошибка зависит от веса)',
  view: { pos: [0, 2.3, 7.6], look: [0, 1.55, -0.4] },
  build(st) {
    const G = st.g;
    platform(st, 6.2, PAL.stripeCream, PAL.duskRose, 1.6);
    st.rig = answerRig(st);
    easel(G, [-4.6, 1.75, 0.2], 0.5, 1.15);
    st.bd = board(G, 2.2, 2.2, 720, 720, [4.75, 2.0, -0.2], -0.5, 88);
    sign(st, [-5.6, 0, 3.4], faceTo([-5.6, 0, 3.4], [0, 0, 7.6]), { title: 'Учёба', body: ['Ошибка бежит назад по нитям', 'и чуть подкручивает все числа.'], formula: 'обратное распространение ошибки' });
    st.rects.push([-3.6, 3.6, 0.6, 1.2], [-3, 3, -1.9, -1.3], [-5.2, -4, -0.3, 0.7], [3.8, 5.6, -0.7, 0.4]);
    hitBox(st, 10, 4, 3.5, [0, 1.8, -0.3]);
    st.data = CNN.dataset(5);
    st.reset = () => {
      st.net = CNN.makeNet(11); st.w0 = st.net.w1.slice(0, 27); st.steps = 0; st.losses = []; st.acc = 0; st.play = false; st.t = 0;
      st.evalAll(); st.show();
    };
    st.evalAll = () => { let ok = 0, loss = 0; for (const d of st.data) { const f = CNN.forward(st.net, d.x); if (f.probs.indexOf(Math.max(...f.probs)) === d.y) ok++; loss -= Math.log(Math.max(1e-9, f.probs[d.y])); } st.ok = ok; st.loss = loss / st.data.length; };
    st.show = () => {
      const F = CNN.forward(st.net, IMG); st.F = F;
      st.rig.set(F.v, st.net.fw, F.probs);
      const kern = []; for (let q = 0; q < 9; q++) { let s = 0, s0 = 0; for (let c = 0; c < 3; c++) { s += st.net.w1[c * 9 + q]; s0 += st.w0[c * 9 + q]; } kern.push([s, s - s0]); }
      st.bd.draw((g, w, h) => {
        g.fillStyle = PAL.inkSoft; g.font = `700 30px ${SANS}`; g.textAlign = 'left'; g.fillText(`ШАГ ${st.steps}  ·  УГАДАЛ ${st.ok} ИЗ ${st.data.length}`, 40, 62);
        // loss curve
        const X0 = 60, X1 = w - 40, Y0 = 300, Y1 = 100;
        quickStroke(g, [[X0, Y1 - 10], [X0, Y0], [X1, Y0]], 3, PAL.ink);
        g.font = `italic 26px ${SERIF}`; g.fillText('ошибка', X0 + 12, Y1 + 8);
        const L = st.losses.concat([st.loss]), mxL = Math.max(1.6, ...L), n = Math.max(30, L.length);
        quickStroke(g, L.map((v, i) => [X0 + (X1 - X0) * i / (n - 1), Y0 - (Y0 - Y1) * v / mxL]), 4, PAL.red);
        g.font = `700 34px ${SANS}`; g.textAlign = 'right'; g.fillStyle = PAL.red; g.fillText(fmt(st.loss, 2), X1, Y1 + 8);
        // kernel numbers
        g.textAlign = 'left'; g.fillStyle = PAL.inkSoft; g.font = `600 27px ${SANS}`; g.fillText('ядро «вертикальные края» сейчас:', 40, 368);
        kern.forEach(([v, d], q) => {
          const x = 70 + (q % 3) * 200, y = 400 + Math.floor(q / 3) * 96;
          const c = valRGB(v / 2); g.fillStyle = `rgb(${c.map((u) => u * 255 | 0)})`; g.fillRect(x, y, 190, 88);
          g.fillStyle = PAL.ink; g.textAlign = 'center'; g.font = `600 36px ${SANS}`; g.fillText(fmt(v, 3), x + 95, y + 46);
          g.font = `600 22px ${SANS}`; g.fillStyle = Math.abs(d) < 5e-4 ? PAL.inkFaint : d > 0 ? '#B5541C' : '#2F6E9E'; g.fillText((d >= 0 ? '+' : '') + fmt(d, 3), x + 95, y + 76);
        });
        inkRect(g, 70, 400, 590, 284, 3.5, PAL.ink, 4);
      });
      if (st.info) st.info.innerHTML = `шаг ${st.steps} · ошибка <b>${fmt(st.loss, 2)}</b> · угадал ${st.ok} из ${st.data.length} · «${PIC}»: <b>${Math.round(F.probs[CNN.CLASSES.indexOf(PIC)] * 100)}%</b>`;
    };
    st.learn = () => {
      st.losses.push(st.loss);
      CNN.trainStep(st.net, st.data, 0.05, 0.02);
      st.steps++; st.evalAll(); st.show(); st.rig.err = 0.7; st.rig.dirtyThreads = true;
      AUDIO.pluck(1 - Math.min(2, st.loss));
    };
    st.refresh = () => st.show();
    st.reset();
    const pre = parseInt(Q.get('learn') || '0', 10); for (let s = 0; s < pre; s++) st.learn();
  },
  update(st, dt) {
    if (st.dist > 40) return;
    if (st.play) { st.t += dt; if (st.t > 0.35) { st.t = 0; st.learn(); if (st.loss < 0.03) { st.play = false; st.syncPlay && st.syncPlay(); } } }
    st.rig.update(dt);
  },
  controls(box) {
    const st = this;
    box.innerHTML = `<button class="btn" data-s>шаг учёбы</button><button class="btn" data-p>▶ учиться само</button><button class="btn" data-r>заново</button>${pickerHTML()}<div class="info"></div>`;
    bindPicker(box); st.info = box.querySelector('.info');
    const pl = box.querySelector('[data-p]');
    st.syncPlay = () => { pl.textContent = st.play ? '❚❚ пауза' : '▶ учиться само'; pl.classList.toggle('on', st.play); };
    box.querySelector('[data-s]').addEventListener('click', () => st.learn());
    pl.addEventListener('click', () => { st.play = !st.play; st.syncPlay(); });
    box.querySelector('[data-r]').addEventListener('click', () => { st.reset(); st.syncPlay(); });
    st.show();
  },
});

const cam = { pos: V3(0, 1.7, 8.5), yaw: 0, pitch: -0.04, tyaw: 0, tpitch: -0.04, vel: V3(), fly: null, walk: 0, eye: 1.7 };
{ const d = V3(CENTER.x - 0, 2.6 - 1.7, CENTER.z - 8.5); cam.yaw = cam.tyaw = Math.atan2(-d.x, -d.z); }
const input = { keys: {}, joy: { x: 0, y: 0 } };
let PORTRAIT = false;

function viewPose(i) {
  const st = stations[i];
  const vw = PORTRAIT && st.pview ? st.pview : st.view;
  const p = st.g.localToWorld(V3(...vw.pos)), l = st.g.localToWorld(V3(...vw.look));
  if (PORTRAIT && !st.pview) { p.sub(l).multiplyScalar(st.pmul || 1.08).add(l); p.y = vw.pos[1] + 0.8; }
  let d = l.clone().sub(p);
  if (camera.aspect > 1.25 && !$('card').classList.contains('min')) {
    // wide screens: slide sideways so the station sits in the free space right of the paper card
    const f = ($('card').offsetWidth + 16) / innerWidth, hh = Math.atan(Math.tan(camera.fov / 360 * Math.PI) * camera.aspect);
    const r = V3(-d.z, 0, d.x).normalize().multiplyScalar(-d.length() * Math.tan(hh) * f * 0.95);
    p.add(r); l.add(r); d = l.clone().sub(p);
  }
  return { pos: p, yaw: Math.atan2(-d.x, -d.z), pitch: Math.atan2(d.y, Math.hypot(d.x, d.z)) + (PORTRAIT ? 0.07 : 0) };
}
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function flyTo(i) {
  const v = viewPose(i);
  const dist = cam.pos.distanceTo(v.pos);
  cam.fly = { i, from: cam.pos.clone(), fy: cam.yaw, fp: cam.pitch, to: v.pos, ty: cam.yaw + angDiff(cam.yaw, v.yaw), tp: v.pitch, t: 0, dur: clamp(1.1 + dist * 0.06, 1.2, 3.2) };

}
function nearestStation() { let b = -1, bd = 1e9; stations.forEach((s, i) => { if (s.dist < bd) { bd = s.dist; b = i; } }); return { i: b, d: bd }; }

window.addEventListener('keydown', (e) => {
  if (e.target && e.target.tagName === 'INPUT') return;
  input.keys[e.code] = true;

});

const joyEl = document.getElementById('joy'), knob = document.getElementById('knob');
const ptrs = new Map();
const ray = new THREE.Raycaster();
function tapAt(x, y) {
  const r = canvas.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2((x - r.left) / r.width * 2 - 1, -((y - r.top) / r.height) * 2 + 1), camera);
  // first: things you can poke at the station you stand at
  const st = active >= 0 ? stations[active] : null;
  if (st && st.pick.length && st.dist < 16) {
    // a finger is fat: also try a few points around the tap, so gaps between columns still count
    for (const [ox, oy] of [[0, 0], [5, 0], [-5, 0], [0, 5], [0, -5], [7, 7], [-7, -7], [7, -7], [-7, 7]]) {
      ray.setFromCamera(new THREE.Vector2((x + ox - r.left) / r.width * 2 - 1, -((y + oy - r.top) / r.height) * 2 + 1), camera);
      const h = ray.intersectObjects(st.pick, false);
      if (h.length && st.onPick) { st.onPick(h[0]); hideHint(); return; }
    }
    ray.setFromCamera(new THREE.Vector2((x - r.left) / r.width * 2 - 1, -((y - r.top) / r.height) * 2 + 1), camera);
  }
  const hits = ray.intersectObjects(stations.map((s) => s.hit), false);
  if (hits.length) { const i = hits[0].object.userData.station; if (i !== active || stations[i].dist > 14) flyTo(i); hideHint(); }
}
canvas.addEventListener('pointerdown', (e) => {
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  const touch = e.pointerType !== 'mouse';
  const isJoy = touch && e.clientX < innerWidth * 0.45 && e.clientY > innerHeight * 0.32 && ![...ptrs.values()].some((p) => p.joy);
  ptrs.set(e.pointerId, { x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, t0: e.timeStamp, joy: isJoy, moved: 0 });

});
canvas.addEventListener('pointermove', (e) => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;

    let jx = e.clientX - p.x0, jy = e.clientY - p.y0; const L = Math.hypot(jx, jy), M = 52;
    if (L > M) { jx *= M / L; jy *= M / L; }

    input.joy.x = jx / M; input.joy.y = -jy / M;

});
function endPtr(e) {

  ptrs.delete(e.pointerId);
  if (p.joy) { joyEl.style.display = 'none'; input.joy.x = input.joy.y = 0; }

canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('touchmove', (e) => { if (e.target === canvas) e.preventDefault(); }, { passive: false });

function collide(p) {
  const dx = p.x - CENTER.x, dz = p.z - CENTER.z, d = Math.hypot(dx, dz), MAXR = 46;
  if (d > MAXR) { p.x = CENTER.x + dx / d * MAXR; p.z = CENTER.z + dz / d * MAXR; }
  if (d < 2.8) { p.x = CENTER.x + dx / (d || 1) * 2.8; p.z = CENTER.z + dz / (d || 1) * 2.8; }
  const pad = 0.3;
  for (const st of stations) {
    if (st.dist > 16) continue;
    const l = st.g.worldToLocal(p.clone());
    for (const [x0, x1, z0, z1] of st.rects) {
      if (l.x > x0 - pad && l.x < x1 + pad && l.z > z0 - pad && l.z < z1 + pad) {
        const opts = [[l.x - (x0 - pad), 'x', x0 - pad], [(x1 + pad) - l.x, 'x', x1 + pad], [l.z - (z0 - pad), 'z', z0 - pad], [(z1 + pad) - l.z, 'z', z1 + pad]];
        opts.sort((a, b) => a[0] - b[0]); l[opts[0][1]] = opts[0][2];
        const w = st.g.localToWorld(l); p.x = w.x; p.z = w.z;

  }
}
function updateCamera(dt) {

    cam.yaw = cam.tyaw = lerp(f.fy, f.ty, k); cam.pitch = cam.tpitch = lerp(f.fp, f.tp, k);
    cam.vel.set(0, 0, 0);
    if (f.t >= 1) { cam.fly = null; cam.eye = f.to.y; }
  } else {
    let mx = input.joy.x, mz = input.joy.y;
    const K = input.keys;
    if (K.KeyW || K.ArrowUp) mz += 1; if (K.KeyS || K.ArrowDown) mz -= 1;
    if (K.KeyA) mx -= 1; if (K.KeyD) mx += 1;
    if (K.ArrowLeft) cam.tyaw += dt * 1.8; if (K.ArrowRight) cam.tyaw -= dt * 1.8;
    const L = Math.hypot(mx, mz); if (L > 1) { mx /= L; mz /= L; }
    const speed = (K.ShiftLeft || K.ShiftRight) ? 7 : 3.6;
    const fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw), rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);

}

function paperURL(color, seed, grain = 1) { return paperCanvas(256, 256, color, { seed, grain, vignette: 0 }).toDataURL(); }
{
  $('card').style.backgroundImage = `url(${paperURL(PAL.paper, 91)})`;
  document.querySelectorAll('#nav .btn').forEach((b, i) => (b.style.backgroundImage = `url(${paperURL(i ? PAL.sun : PAL.paper, 92 + i)})`));
  const c = mkCanvas(256, 256), g = c.getContext('2d'), im = g.createImageData(256, 256), R = mulberry(7);
  for (let i = 0; i < im.data.length; i += 4) { const v = 128 + (R() - 0.5) * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0);

let active = -2;
const ctrlCache = {};
function setActive(i, open) {
  if (open) $('card').classList.remove('min');
  if (i === active) return;
  active = i;
  const box = $('cctrls');
  [...box.children].forEach((c) => c.remove());
  if (i < 0) {
    $('cnum').textContent = '◫'; $('cnum').style.background = PAL.sun;
    $('ctitle').textContent = 'Сад свёрточной сети';
    $('ctext').textContent = innerWidth < 600 || innerHeight < 520
      ? 'Восемь станций: как сеть делает из картинки таблицы чисел, потом вектор, потом ответ «кот». Иди по жёлтой дорожке или жми «к станции».'
      : 'Восемь станций о том, как свёрточная сеть (convolutional neural network) делает из картинки таблицы чисел, из таблиц другие таблицы, потом один длинный вектор и, наконец, ответ «это кот». Все числа здесь настоящие. Иди по жёлтой дорожке или жми «к станции».';
    $('cformula').textContent = 'для любопытных: 26×26×3 → свёртки, сжатия → 144 числа → 4 доли';
  } else {
    const st = stations[i];
    $('cnum').textContent = i + 1; $('cnum').style.background = CARD_COL[i];
    $('ctitle').textContent = st.title; $('ctext').textContent = innerWidth < 600 || innerHeight < 520 ? st.short : st.text; $('cformula').textContent = 'для любопытных: ' + st.formula;
    if (!ctrlCache[i]) { const d = document.createElement('div'); d.style.display = 'contents'; st.controls(d); ctrlCache[i] = d; }
    box.appendChild(ctrlCache[i]);

}
function updateNext() {
  const n = nextIndex();
  $('next').textContent = `к станции ${n + 1} →`;
}
function nextIndex() {
  const cur = cam.fly ? cam.fly.i : active;
  return cur < 0 ? 0 : (cur + 1) % stations.length;
}
function nextStation() { flyTo(nextIndex()); hideHint(); }
$('next').addEventListener('click', nextStation);
$('tog').addEventListener('click', () => { $('card').classList.toggle('min'); $('tog').textContent = $('card').classList.contains('min') ? '+' : '–'; });
function toggleSound() { const on = AUDIO.toggle(); $('snd').textContent = on ? '♪ звук вкл' : '♪ звук'; $('snd').classList.toggle('on', on); }
$('snd').addEventListener('click', toggleSound);
let hintShown = true;
$('hint').innerHTML = IS_TOUCH
  ? '<span>левый палец: идти</span><span>правый: осмотреться</span><span>тап по станции: перелёт</span>'
  : '<span>WASD: идти</span><span>мышь с зажатой кнопкой: смотреть</span><span>клик по станции: перелёт</span><span>N: дальше</span>';
function hideHint() { if (!hintShown) return; hintShown = false; $('hint').style.opacity = 0; }
setTimeout(hideHint, 12000);
if (Q.has('shot')) { $('hint').style.display = 'none'; }

// resize & loop
// ---------------------------------------------------------------------------
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  PORTRAIT = w / h < 0.8;
  const minH = 60 / 180 * Math.PI; // keep at least ~60° horizontally
  let v = 2 * Math.atan(Math.tan(minH / 2) / camera.aspect) * 180 / Math.PI;
  camera.fov = clamp(v, 58, 92);
  camera.updateProjectionMatrix();
  const b = renderer.getDrawingBufferSize(new THREE.Vector2()); SH.uRes.value.copy(b);
}
addEventListener('resize', () => { const was = PORTRAIT; resize(); if (was !== PORTRAIT) for (const st of stations) st.dirty = true; }); resize();

// start pose (optionally at a station, for links and screenshots)
{
  const s = parseInt(Q.get('st') || '0', 10);
  if (s >= 1 && s <= stations.length) { const v = viewPose(s - 1); cam.pos.copy(v.pos); cam.eye = v.pos.y; cam.yaw = cam.tyaw = v.yaw; cam.pitch = cam.tpitch = v.pitch; }
}
let last = performance.now(), T = 0, frames = 0, fpsAcc = 0, fpsN = 0;
const showFps = Q.has('fps'); if (showFps) $('fps').style.display = 'block';
function loop(now) {
  const dt = clamp((now - last) / 1000, 0, 0.05); last = now; T += dt; frames++;
  SH.uTime.value = T;
  updateCamera(dt);
  for (const st of stations) {
    st.dist = Math.hypot(cam.pos.x - st.P.x, cam.pos.z - st.P.z);
    st.reveal = Math.min(1, st.reveal + (st.dist < 26 ? dt * 0.55 : 0));

  sky.position.copy(camera.position);
  renderer.render(scene, camera);
  if (showFps) { fpsAcc += dt; fpsN++; if (fpsAcc > 0.5) { $('fps').textContent = Math.round(fpsN / fpsAcc) + ' fps · ' + renderer.info.render.triangles + ' tri · ' + renderer.info.render.calls + ' calls'; fpsAcc = 0; fpsN = 0; } }
