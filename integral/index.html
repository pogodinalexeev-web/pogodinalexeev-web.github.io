<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2F2748">
<link rel="icon" href="data:,">
<title>Сад интеграла — прогулка про синус, косинус и площадь</title>
<style>
  :root{
    --paper:#EFE3C9; --paperShade:#E2D1B0; --ink:#2A1C13; --inkSoft:#5B4331; --inkFaint:#8A735C;
    --warm:#D8742B; --cold:#3B8EE0; --teal:#3C8783; --sun:#F1BF4A; --rose:#C88C86;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"DejaVu Serif",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:#2F2748;color:var(--ink);
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    font-family:var(--sans);overscroll-behavior:none}
  canvas#gl{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none}
  #grain{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.11;mix-blend-mode:multiply;background-size:256px 256px}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(47,39,72,.30) 100%)}
  .paper{background-color:var(--paper);background-size:256px 256px;border:2px solid var(--ink);border-radius:14px 16px 13px 15px;
    box-shadow:4px 5px 0 rgba(42,28,19,.32)}
  #card{position:fixed;z-index:5;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));
    width:min(430px,calc(100vw - 24px));box-sizing:border-box;padding:12px 16px 12px 16px;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s}
  #card .row{display:flex;gap:12px;align-items:flex-start}
  #card .num{flex:0 0 auto;width:38px;height:38px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;
    font:700 20px/1 var(--serif);background:var(--sun);transform:rotate(-4deg)}
  #card h2{margin:1px 22px 4px 0;font:700 20px/1.15 var(--serif);letter-spacing:.01em}
  #card p{margin:0;font:15px/1.35 var(--sans);color:var(--inkSoft)}
  #card .ctrls{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
  #card .ctrls label{font:600 13px/1 var(--sans);color:var(--inkSoft);display:flex;align-items:center;gap:8px;flex:1 1 100%}
  #card .ctrls label b{font:700 18px/1 var(--serif);color:var(--ink);min-width:44px;text-align:right}
  #card .formula{margin-top:8px;font:italic 12px/1.2 var(--serif);color:var(--inkFaint)}
  #card.min .body{display:none}
  #card .tog{position:absolute;right:8px;top:6px;border:0;background:none;font:700 18px var(--sans);color:var(--inkFaint);padding:6px}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:30px;background:transparent;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--paperShade);border:1.5px solid var(--ink)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--warm);border:2px solid var(--ink);margin-top:-11px;box-shadow:2px 2px 0 rgba(42,28,19,.35)}
  input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--paperShade);border:1.5px solid var(--ink)}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--warm);border:2px solid var(--ink)}
  .btn{font:600 14px/1 var(--sans);color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:20px;padding:9px 14px;
    box-shadow:2px 3px 0 rgba(42,28,19,.35);cursor:pointer}
  .btn.on{background:var(--sun)}
  .btn:active{transform:translate(2px,2px);box-shadow:0 1px 0 rgba(42,28,19,.35)}
  #nav{position:fixed;z-index:5;right:max(14px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center}
  #nav .btn{font-size:15px;padding:12px 16px;background-color:var(--paper);background-size:256px}
  #next{background:var(--sun)!important}
  #joy{position:fixed;z-index:4;width:124px;height:124px;border-radius:50%;border:2px dashed rgba(251,246,234,.75);
    background:rgba(42,28,19,.18);display:none;pointer-events:none;transform:translate(-50%,-50%)}
  #knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);box-shadow:2px 3px 0 rgba(42,28,19,.35)}
  #hint{position:fixed;z-index:4;left:50%;bottom:max(84px,calc(env(safe-area-inset-bottom) + 76px));transform:translateX(-50%);
    font:600 14px/1.3 var(--sans);color:#FBF6EA;text-align:center;text-shadow:0 1px 3px rgba(20,14,30,.8);transition:opacity 1s;pointer-events:none;width:92vw}
  #hint span{display:inline-block;margin:0 8px}
  #joyzone{position:fixed;z-index:3;left:14px;bottom:max(18px,env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;
    border:2px dashed rgba(251,246,234,.45);pointer-events:none;display:none}
  body.touch #joyzone{display:block}
  #fps{position:fixed;right:6px;top:4px;z-index:9;font:11px monospace;color:#fff;opacity:.5;display:none}
  @media (max-width:560px){
    #card{padding:9px 11px 8px 11px;border-radius:12px}
    #card h2{font-size:16px}
    #card p{font-size:13px;line-height:1.3}
    #card .ctrls{margin-top:6px;gap:6px 8px}
    #card .ctrls .btn{padding:7px 11px;font-size:13px}
    #card .formula{margin-top:4px;font-size:11px}
    #card .num{width:32px;height:32px;font-size:17px}
    #nav .btn{font-size:14px;padding:11px 13px}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div>
<div id="grain"></div>
<div id="card" class="paper">
  <button class="tog" id="tog" aria-label="свернуть">–</button>
  <div class="row"><div class="num" id="cnum">∫</div><div><h2 id="ctitle">Сад интеграла</h2><div class="body"><p id="ctext"></p></div></div></div>
  <div class="body"><div class="ctrls" id="cctrls"></div><div class="formula" id="cformula"></div></div>
</div>
<div id="nav"><button class="btn" id="snd">♪ звук</button><button class="btn" id="next">к станции 1 →</button></div>
<div id="joyzone"></div>
<div id="joy"><div id="knob"></div></div>
<div id="hint"></div>
<div id="fps"></div>
<script type="module">
import * as THREE from './lib/three.module.js';
THREE.ColorManagement.enabled = false;

// ---------------------------------------------------------------------------
// palette (procedural-film house palette + subject tints)
// ---------------------------------------------------------------------------
const PAL = {
  paper: '#EFE3C9', paperShade: '#E2D1B0', paperDeep: '#CDB58C',
  stripeCream: '#F2E7CF', stripeYellow: '#EFDCA3', stripeApricot: '#F0D9B5', stripeSage: '#DCE3CC', stripeSky: '#C9D3D2',
  ink: '#2A1C13', inkSoft: '#5B4331', inkFaint: '#8A735C',
  tan: '#C8A47A', ochre: '#C38F2E', rose: '#C88C86', duskRose: '#E3B1A1', sage: '#94A47F',
  teal: '#3C8783', tealDeep: '#285F5D', sun: '#F1BF4A', nightSky: '#4E3F6E', night: '#2F2748', white: '#FBF6EA',
  orange: '#D8742B', leaf: '#6E8F4F', wood: '#A8784C', red: '#BF3F2C', dusk: '#5A4878',
  navy: '#0B1230', navyLight: '#18234D', grid: '#3A4A86', lavender: '#C8C1EF', lineWhite: '#EEF0FF', paleBlue: '#9CC2EA', glow: '#FFF3DC',
  annBlue: '#3B8EE0', annMagenta: '#E43D8C', annYellow: '#EAB530',
  warm: '#E0782E', warmLight: '#F1BF4A', cold: '#3E8FC4', coldLight: '#9CC2EA', water: '#3C8783', waterLight: '#8CC3BB',
};
const col = (h) => new THREE.Color(h);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
function mulberry(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hash1(i, s) { let h = Math.imul((i | 0) ^ Math.imul(s | 0, 0x9E3779B1), 0x85EBCA6B); h ^= h >>> 13; h = Math.imul(h, 0xC2B2AE35); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function noise1(x, s = 0) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash1(i, s), hash1(i + 1, s), u) * 2 - 1; }
const fmt = (v, d = 2) => v.toFixed(d).replace('.', ',').replace('-', '−');

const IS_TOUCH = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
if (IS_TOUCH) document.body.classList.add('touch');
const Q = new URLSearchParams(location.search);

// ---------------------------------------------------------------------------
// renderer
// ---------------------------------------------------------------------------
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: Q.has('shot') });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
const DPR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(DPR);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.08, 400);
camera.rotation.order = 'YXZ';

// shared uniforms (same objects referenced from every material)
const SH = {
  uTime: { value: 0 },
  uFogColor: { value: col('#EDCFAE') },
  uFogDensity: { value: 0.0095 },
  uLightDir: { value: new THREE.Vector3(0.25, 0.9, 0.38).normalize() },
  uInk: { value: col(PAL.ink) },
  uRes: { value: new THREE.Vector2(1, 1) },
  uDpr: { value: DPR },
};

const GLSL_COMMON = /* glsl */`
  uniform float uTime; uniform vec3 uFogColor; uniform float uFogDensity; uniform vec3 uLightDir; uniform vec3 uInk; uniform vec2 uRes; uniform float uDpr;
  float hash21(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
  float fogAmt(vec3 w){ float d = length(w - cameraPosition); return 1.0 - exp(-pow(d*uFogDensity, 1.5)); }
`;

// ---------------------------------------------------------------------------
// ink material: flat paper colour, cool shadow, screen-space hatching,
// optional uv border (pixel-constant ink edge), grain, fog
// ---------------------------------------------------------------------------
const INK_VS = /* glsl */`
  varying vec3 vN; varying vec3 vW; varying vec2 vUv; varying vec3 vCol;
  void main(){
    mat4 m = modelMatrix;
    #ifdef USE_INSTANCING
      m = m * instanceMatrix;
    #endif
    vCol = vec3(1.0);
    #ifdef USE_INSTANCING_COLOR
      vCol = instanceColor;
    #endif
    vec4 w = m * vec4(position, 1.0);
    vW = w.xyz; vN = normalize(mat3(m) * normal); vUv = uv;
    gl_Position = projectionMatrix * viewMatrix * w;
  }`;
const INK_FS = /* glsl */`
  ${GLSL_COMMON}
  uniform vec3 uColor; uniform sampler2D uMap; uniform float uUseMap; uniform vec2 uRepeat;
  uniform float uHatch, uBorder, uFlat, uOpacity, uAlphaTest, uFog, uEmit;
  varying vec3 vN; varying vec3 vW; varying vec2 vUv; varying vec3 vCol;
  void main(){
    vec3 base = uColor * vCol; float a = uOpacity;
    if (uUseMap > 0.5) { vec4 t = texture2D(uMap, vUv * uRepeat); base *= t.rgb; a *= t.a; }
    if (a < uAlphaTest) discard;
    vec3 N = normalize(vN); if (!gl_FrontFacing) N = -N;
    float l = dot(N, uLightDir) * 0.5 + 0.5;
    vec3 V = normalize(cameraPosition - vW);
    vec3 shade = base * vec3(0.70, 0.66, 0.80);
    float lit = mix(smoothstep(0.24, 0.52, l), 1.0, uFlat);
    vec3 c = mix(shade, base, lit);
    float rim = pow(1.0 - max(dot(N, V), 0.0), 3.0);
    c += vec3(0.22, 0.13, 0.05) * rim * (1.0 - uFlat) * 0.5;
    float px = 1.0 / uDpr;
    float s1 = (gl_FragCoord.x + gl_FragCoord.y) * px / 4.5;
    float line1 = 1.0 - smoothstep(0.2, 0.5, abs(fract(s1) - 0.5) * 2.0);
    float s2 = (gl_FragCoord.x - gl_FragCoord.y) * px / 4.5;
    float line2 = 1.0 - smoothstep(0.2, 0.5, abs(fract(s2) - 0.5) * 2.0);
    float amt1 = (1.0 - smoothstep(0.26, 0.46, l)) * (1.0 - uFlat);
    float amt2 = (1.0 - smoothstep(0.06, 0.24, l)) * (1.0 - uFlat);
    c = mix(c, uInk, uHatch * (line1 * amt1 * 0.30 + line2 * amt2 * 0.25));
    if (uBorder > 0.0) {
      vec2 fw = max(fwidth(vUv), vec2(1e-5)); vec2 d = min(vUv, 1.0 - vUv) / fw;
      vec2 bw = min(vec2(uBorder * uDpr), 0.2 / fw);
      float ex = smoothstep(bw.x - 0.6, bw.x + 0.6, d.x), ey = smoothstep(bw.y - 0.6, bw.y + 0.6, d.y);
      c = mix(uInk, c, min(ex, ey));
    }
    c = mix(c, base, uEmit);
    c += (hash21(floor(gl_FragCoord.xy * px)) - 0.5) * 0.05;
    c = mix(c, uFogColor, fogAmt(vW) * uFog);
    gl_FragColor = vec4(c, a);
  }`;
function inkMat(o = {}) {
  const m = new THREE.ShaderMaterial({
    uniforms: Object.assign({
      uColor: { value: col(o.color || '#ffffff') },
      uMap: { value: o.map || null }, uUseMap: { value: o.map ? 1 : 0 },
      uRepeat: { value: new THREE.Vector2(...(o.repeat || [1, 1])) },
      uHatch: { value: o.hatch ?? 1 }, uBorder: { value: o.border || 0 }, uFlat: { value: o.flat || 0 },
      uOpacity: { value: o.opacity ?? 1 }, uAlphaTest: { value: o.alphaTest || 0 }, uFog: { value: o.fog ?? 1 }, uEmit: { value: o.emit || 0 },
    }, SH),
    vertexShader: INK_VS, fragmentShader: INK_FS,
    transparent: !!o.transparent, side: o.side ?? THREE.FrontSide, depthWrite: o.depthWrite ?? true,
  });
  m.extensions = { derivatives: true };
  return m;
}

// inverted-hull ink outline
const OUT_VS = /* glsl */`
  uniform float uOut; varying vec3 vW;
  void main(){
    mat4 m = modelMatrix;
    #ifdef USE_INSTANCING
      m = m * instanceMatrix;
    #endif
    vec4 w = m * vec4(position, 1.0);
    vec3 n = normalize(mat3(m) * normal);
    float d = length(cameraPosition - w.xyz);
    w.xyz += n * uOut * (0.7 + d * 0.035);
    vW = w.xyz;
    gl_Position = projectionMatrix * viewMatrix * w;
  }`;
const OUT_FS = /* glsl */`${GLSL_COMMON} uniform vec3 uColor; varying vec3 vW;
  void main(){ gl_FragColor = vec4(mix(uColor, uFogColor, fogAmt(vW)), 1.0); }`;
const outlineMats = {};
function outlineMat(w = 0.018, c = PAL.ink) {
  const k = w + c;
  if (!outlineMats[k]) outlineMats[k] = new THREE.ShaderMaterial({ uniforms: Object.assign({ uOut: { value: w }, uColor: { value: col(c) } }, SH), vertexShader: OUT_VS, fragmentShader: OUT_FS, side: THREE.BackSide });
  return outlineMats[k];
}
function outline(mesh, w, c) { const o = new THREE.Mesh(mesh.geometry, outlineMat(w, c)); o.raycast = () => {}; mesh.add(o); return mesh; }
function mesh(geo, mat, parent, pos, rot, out) {
  const m = new THREE.Mesh(geo, mat);
  if (pos) m.position.set(...pos);
  if (rot) m.rotation.set(...rot);
  if (out) outline(m, out === true ? 0.018 : out);
  if (parent) parent.add(m);
  return m;
}

// ---------------------------------------------------------------------------
// fat hand-drawn lines: screen-facing ribbons, world-space width, pressure
// variation, boil (the hand-drawn shimmer), dashes, draw-on progress, glow
// ---------------------------------------------------------------------------
const LINE_VS = /* glsl */`
  ${GLSL_COMMON}
  attribute vec3 prev; attribute vec3 next; attribute float side; attribute float lu; attribute float wv;
  uniform float uWidth, uMinPx, uBoil;
  varying float vU; varying float vSide; varying vec3 vW;
  void main(){
    mat4 mvp = projectionMatrix * viewMatrix * modelMatrix;
    vec4 c = mvp * vec4(position, 1.0); vec4 cp = mvp * vec4(prev, 1.0); vec4 cn = mvp * vec4(next, 1.0);
    float asp = uRes.x / uRes.y;
    vec2 s = c.xy / max(abs(c.w), 1e-4), sp = cp.xy / max(abs(cp.w), 1e-4), sn = cn.xy / max(abs(cn.w), 1e-4);
    s.x *= asp; sp.x *= asp; sn.x *= asp;
    vec2 d1 = s - sp, d2 = sn - s;
    vec2 t = vec2(0.0);
    if (dot(d1, d1) > 1e-12) t += normalize(d1);
    if (dot(d2, d2) > 1e-12) t += normalize(d2);
    if (dot(t, t) < 1e-12) t = vec2(1.0, 0.0);
    t = normalize(t);
    vec2 nr = vec2(-t.y, t.x);
    float boil = 1.0 + uBoil * 0.22 * sin(lu * 61.0 + floor(uTime * 8.0) * 2.37);
    float hw = max(uWidth * 0.5 * projectionMatrix[1][1] * wv * boil, uMinPx * uDpr / uRes.y * c.w);
    vec2 off = nr * hw * side; off.x /= asp;
    c.xy += off;
    gl_Position = c; vU = lu; vSide = side; vW = (modelMatrix * vec4(position, 1.0)).xyz;
  }`;
const LINE_FS = /* glsl */`
  ${GLSL_COMMON}
  uniform vec3 uColor; uniform float uOpacity, uDash, uDashRatio, uProgress, uGlow, uFog, uDashShift;
  varying float vU; varying float vSide; varying vec3 vW;
  void main(){
    if (vU > uProgress) discard;
    if (uDash > 0.0 && fract(vU * uDash - uDashShift) > uDashRatio) discard;
    float e = abs(vSide);
    float a = uOpacity;
    float f = fogAmt(vW) * uFog;
    if (uGlow > 0.5) { a *= pow(max(1.0 - e, 0.0), 1.8) * (1.0 - f); gl_FragColor = vec4(uColor, a); return; }
    gl_FragColor = vec4(mix(uColor, uFogColor, f), a);
  }`;
class Line {
  constructor(max, o = {}) {
    this.max = max;
    const g = new THREE.BufferGeometry();
    const n = max * 2;
    this.pos = new Float32Array(n * 3); this.prev = new Float32Array(n * 3); this.next = new Float32Array(n * 3);
    const side = new Float32Array(n), wv = new Float32Array(n);
    this.lu = new Float32Array(n);
    const seed = o.seed ?? Math.floor(Math.random() * 1000);
    for (let i = 0; i < max; i++) {
      side[i * 2] = -1; side[i * 2 + 1] = 1;
      const w = o.pressure === 0 ? 1 : 0.8 + 0.4 * (noise1(i * 0.09, seed) * 0.5 + 0.5);
      wv[i * 2] = wv[i * 2 + 1] = w;
    }
    g.setAttribute('position', new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('prev', new THREE.BufferAttribute(this.prev, 3).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('next', new THREE.BufferAttribute(this.next, 3).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('side', new THREE.BufferAttribute(side, 1));
    g.setAttribute('wv', new THREE.BufferAttribute(wv, 1));
    g.setAttribute('lu', new THREE.BufferAttribute(this.lu, 1).setUsage(THREE.DynamicDrawUsage));
    this.index = new Uint32Array((max - 1) * 6);
    g.setIndex(new THREE.BufferAttribute(this.index, 1).setUsage(THREE.DynamicDrawUsage));
    this.geo = g;
    const glow = !!o.glow;
    this.mat = new THREE.ShaderMaterial({
      uniforms: Object.assign({
        uColor: { value: col(o.color || PAL.ink) }, uWidth: { value: o.width ?? 0.03 }, uMinPx: { value: o.minPx ?? 1.0 },
        uOpacity: { value: o.opacity ?? 1 }, uDash: { value: 0 }, uDashRatio: { value: o.dashRatio ?? 0.55 }, uDashShift: { value: 0 },
        uProgress: { value: 1.01 }, uGlow: { value: glow ? 1 : 0 }, uBoil: { value: o.boil ?? 1 }, uFog: { value: o.fog ?? 1 },
      }, SH),
      vertexShader: LINE_VS, fragmentShader: LINE_FS,
      transparent: glow || (o.opacity ?? 1) < 1, depthWrite: !glow && (o.opacity ?? 1) >= 1,
      blending: glow ? THREE.AdditiveBlending : THREE.NormalBlending, side: THREE.DoubleSide,
    });
    this.dashLen = o.dash || 0;
    this.mesh = new THREE.Mesh(g, this.mat);
    this.mesh.frustumCulled = false;
    this.mesh.raycast = () => {};
    if (o.order) this.mesh.renderOrder = o.order;
    if (o.parent) o.parent.add(this.mesh);
    if (o.pts) this.set(o.pts);
    if (o.strips) this.setStrips(o.strips);
  }
  set(pts) { return this.setStrips([pts]); }
  setStrips(strips) {
    let v = 0, idx = 0, total = 0;
    const P = this.pos, Pr = this.prev, Nx = this.next, U = this.lu, I = this.index;
    for (const pts of strips) {
      const n = pts.length; if (n < 2 || v + n > this.max) continue;
      let L = 0;
      for (let i = 1; i < n; i++) L += pts[i].distanceTo(pts[i - 1]);
      total += L;
      let acc = 0;
      for (let i = 0; i < n; i++) {
        const p = pts[i];
        if (i > 0) acc += p.distanceTo(pts[i - 1]);

const cam = { pos: V3(0, 1.7, 8.5), yaw: 0, pitch: -0.04, tyaw: 0, tpitch: -0.04, vel: V3(), fly: null, walk: 0 };
{ const d = V3(CENTER.x - 0, 2.6 - 1.7, CENTER.z - 8.5); cam.yaw = cam.tyaw = Math.atan2(-d.x, -d.z); }
const input = { keys: {}, joy: { x: 0, y: 0 } };
let PORTRAIT = false;

function viewPose(i) {
  const st = stations[i];
  const p = st.g.localToWorld(V3(...st.view.pos)), l = st.g.localToWorld(V3(...st.view.look));
  if (PORTRAIT) { p.sub(l).multiplyScalar(1.16).add(l); p.y = 1.7 + (st.view.pos[1] - 1.7); }
  let d = l.clone().sub(p);

    const r = V3(-d.z, 0, d.x).normalize().multiplyScalar(-1.25);

}
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }

}
function nearestStation() { let b = -1, bd = 1e9; stations.forEach((s, i) => { if (s.dist < bd) { bd = s.dist; b = i; } }); return { i: b, d: bd }; }

window.addEventListener('keydown', (e) => {
  input.keys[e.code] = true;
  if (e.code === 'KeyN' || e.code === 'Enter') nextStation();

const joyEl = document.getElementById('joy'), knob = document.getElementById('knob');

canvas.addEventListener('pointermove', (e) => {
  const p = ptrs.get(e.pointerId); if (!p) return;

function endPtr(e) {

canvas.addEventListener('contextmenu', (e) => e.preventDefault());

function collide(p) {
  // world bound
  const dx = p.x - CENTER.x, dz = p.z - CENTER.z, d = Math.hypot(dx, dz), MAXR = 42;
  if (d > MAXR) { p.x = CENTER.x + dx / d * MAXR; p.z = CENTER.z + dz / d * MAXR; }
  if (d < 2.2) { p.x = CENTER.x + dx / (d || 1) * 2.2; p.z = CENTER.z + dz / (d || 1) * 2.2; }
  const pad = 0.3;
  for (const st of stations) {
    if (st.dist > 16) continue;
    const l = st.g.worldToLocal(p.clone());
    for (const [x0, x1, z0, z1] of st.rects) {
      if (l.x > x0 - pad && l.x < x1 + pad && l.z > z0 - pad && l.z < z1 + pad) {
        const opts = [[l.x - (x0 - pad), 'x', x0 - pad], [(x1 + pad) - l.x, 'x', x1 + pad], [l.z - (z0 - pad), 'z', z0 - pad], [(z1 + pad) - l.z, 'z', z1 + pad]];
        opts.sort((a, b) => a[0] - b[0]); l[opts[0][1]] = opts[0][2];
        const w = st.g.localToWorld(l); p.x = w.x; p.z = w.z;

  }
}
function updateCamera(dt) {
  if (cam.fly) {

    cam.pos.lerpVectors(f.from, f.to, k);

    cam.yaw = cam.tyaw = lerp(f.fy, f.ty, k); cam.pitch = cam.tpitch = lerp(f.fp, f.tp, k);
    cam.vel.set(0, 0, 0);
    if (f.t >= 1) cam.fly = null;
  } else {
    let mx = input.joy.x, mz = input.joy.y;
    const K = input.keys;
    if (K.KeyW || K.ArrowUp) mz += 1; if (K.KeyS || K.ArrowDown) mz -= 1;
    if (K.KeyA) mx -= 1; if (K.KeyD) mx += 1;
    if (K.ArrowLeft) cam.tyaw += dt * 1.8; if (K.ArrowRight) cam.tyaw -= dt * 1.8;

    collide(cam.pos);
    if (L > 0.05 && (Math.abs(K.KeyW || 0) || input.joy.y)) hideHint();

    cam.yaw += (cam.tyaw - cam.yaw) * kk; cam.pitch += (cam.tpitch - cam.pitch) * kk;

}

function paperURL(color, seed, grain = 1) { return paperCanvas(256, 256, color, { seed, grain, vignette: 0 }).toDataURL(); }
{
  $('card').style.backgroundImage = `url(${paperURL(PAL.paper, 91)})`;
  document.querySelectorAll('#nav .btn').forEach((b, i) => (b.style.backgroundImage = `url(${paperURL(i ? PAL.sun : PAL.paper, 92 + i)})`));
  const c = mkCanvas(256, 256), g = c.getContext('2d'), im = g.createImageData(256, 256), R = mulberry(7);
  for (let i = 0; i < im.data.length; i += 4) { const v = 128 + (R() - 0.5) * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }

let active = -2;
const ctrlCache = {};
function setActive(i, open) {

  active = i;
  const box = $('cctrls');
  [...box.children].forEach((c) => c.remove());

    $('cformula').textContent = '';
  } else {
    const st = stations[i];
    $('cnum').textContent = i + 1; $('cnum').style.background = [PAL.sun, PAL.stripeYellow, PAL.waterLight, PAL.duskRose][i];
    $('ctitle').textContent = st.title; $('ctext').textContent = innerWidth < 600 ? st.short : st.text; $('cformula').textContent = 'для любопытных: ' + st.formula;
    if (!ctrlCache[i]) { const d = document.createElement('div'); d.style.display = 'contents'; st.controls(d); ctrlCache[i] = d; }

}

  return cur < 0 ? 0 : (cur + 1) % stations.length;
}
function nextStation() { flyTo(nextIndex()); hideHint(); }
$('next').addEventListener('click', nextStation);
$('tog').addEventListener('click', () => { $('card').classList.toggle('min'); $('tog').textContent = $('card').classList.contains('min') ? '+' : '–'; });
function toggleSound() { const on = AUDIO.toggle(); $('snd').textContent = on ? '♪ звук вкл' : '♪ звук'; $('snd').classList.toggle('on', on); }
$('snd').addEventListener('click', toggleSound);
let hintShown = true;
$('hint').innerHTML = IS_TOUCH
  ? '<span>левый палец — идти</span><span>правый — осмотреться</span><span>тап по станции — перелёт</span>'
  : '<span>WASD — идти</span><span>мышь с зажатой кнопкой — смотреть</span><span>клик по станции — перелёт</span><span>N — дальше</span>';
function hideHint() { if (!hintShown) return; hintShown = false; $('hint').style.opacity = 0; }
setTimeout(hideHint, 12000);
if (Q.has('shot')) { $('hint').style.display = 'none'; }

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  PORTRAIT = w / h < 0.8;
  const minH = 60 / 180 * Math.PI; // keep at least ~60° horizontally
  let v = 2 * Math.atan(Math.tan(minH / 2) / camera.aspect) * 180 / Math.PI;
  camera.fov = clamp(v, 58, 92);
  camera.updateProjectionMatrix();
  const b = renderer.getDrawingBufferSize(new THREE.Vector2()); SH.uRes.value.copy(b);
}
addEventListener('resize', resize); resize();

// start pose (optionally at a station, for links and screenshots)
{
  const s = parseInt(Q.get('st') || '0', 10);
  if (s >= 1 && s <= 4) { const v = viewPose(s - 1); cam.pos.copy(v.pos); cam.yaw = cam.tyaw = v.yaw; cam.pitch = cam.tpitch = v.pitch; }
}
let last = performance.now(), T = 0, frames = 0, fpsAcc = 0, fpsN = 0;
const showFps = Q.has('fps'); if (showFps) $('fps').style.display = 'block';
function loop(now) {
  const dt = clamp((now - last) / 1000, 0, 0.05); last = now; T += dt; frames++;
  SH.uTime.value = T;
  updateCamera(dt);
  for (const st of stations) {
    st.dist = Math.hypot(cam.pos.x - st.P.x, cam.pos.z - st.P.z);
    st.reveal = Math.min(1, st.reveal + (st.dist < 26 ? dt * 0.55 : 0));
    SND.prox[st.i] = smooth(22, 7, st.dist);
    st.update(st, dt);
  }
  if (stations[3].syncUI && active === 3) stations[3].syncUI();
  const n = nearestStation();
  if (!cam.fly) setActive(n.d < 14 ? n.i : -1, false);
  armillary.rotation.y += dt * 0.12;
  armillary.userData.r4.rotation.z += dt * 0.3;
  { const a = T * 0.9; armillary.userData.orb.position.set(Math.cos(a) * 1.6, Math.sin(a) * 1.6, 0); }
  sky.position.copy(camera.position);
  AUDIO.update(dt);
  renderer.render(scene, camera);
  if (showFps) { fpsAcc += dt; fpsN++; if (fpsAcc > 0.5) { $('fps').textContent = Math.round(fpsN / fpsAcc) + ' fps · ' + renderer.info.render.triangles + ' tri · ' + renderer.info.render.calls + ' calls'; fpsAcc = 0; fpsN = 0; } }

  requestAnimationFrame(loop);
}
setActive(-1);
requestAnimationFrame(loop);
window.__stats = () => ({ tri: renderer.info.render.triangles, calls: renderer.info.render.calls });
window.__flyTo = flyTo; window.__st = stations; window.__cam = cam; window.__nan = () => { const out = []; scene.traverse((o) => { const p = o.geometry && o.geometry.attributes.position; if (p) { for (let i = 0; i < p.array.length; i++) if (isNaN(p.array[i])) { out.push(o.type + ':' + JSON.stringify(o.geometry.parameters) + (o.parent && o.parent.type) + ':' + p.array.length + ':' + i + ':' + JSON.stringify(o.position)); break; } } }); return out; };
