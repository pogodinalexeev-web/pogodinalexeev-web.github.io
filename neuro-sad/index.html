<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2F2748">
<link rel="icon" href="data:,">
<title>Курс нейросетей — 13 стендов по тропе</title>
<style>
  :root{
    --paper:#EFE3C9; --paperShade:#E2D1B0; --ink:#2A1C13; --inkSoft:#4A3526; --inkFaint:#7A6550;
    --warm:#D8742B; --cold:#3B8EE0; --teal:#3C8783; --sun:#F1BF4A; --rose:#C88C86; --red:#BF3F2C;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"DejaVu Serif",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  }
  html,body{margin:0;height:100%;overflow:hidden;background:#2F2748;color:var(--ink);
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    font-family:var(--sans);overscroll-behavior:none;-webkit-text-size-adjust:100%}
  canvas#gl{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none}
  #grain{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.10;mix-blend-mode:multiply;background-size:256px 256px}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 60%,rgba(47,39,72,.28) 100%)}
  .paper{background-color:var(--paper);background-size:256px 256px;border:2px solid var(--ink);border-radius:14px 16px 13px 15px;box-shadow:4px 5px 0 rgba(42,28,19,.32)}
  .hidden{display:none!important}

  /* progress strip */
  #prog{position:fixed;z-index:6;left:10px;right:10px;top:calc(var(--st) + 8px);height:44px;box-sizing:border-box;padding:0 8px 0 4px;
    display:flex;align-items:center;gap:8px;border-radius:22px}
  #back{flex:0 0 auto;width:38px;height:38px;border:0;background:none;font:700 26px/1 var(--sans);color:var(--ink);cursor:pointer;padding:0}
  #ptext{flex:0 0 auto;font:700 16px/1 var(--sans);color:var(--ink);white-space:nowrap}
  #dots{flex:1 1 auto;display:flex;gap:4px;justify-content:flex-end;align-items:center;min-width:0}
  .dot{flex:0 1 13px;width:13px;height:13px;min-width:7px;border-radius:50%;border:2px solid var(--ink);background:transparent;padding:0;cursor:pointer}
  .dot.seen{background:#D9C79F}
  .dot.on{background:var(--warm);transform:scale(1.25)}

  /* station card: header, scrolling body, lesson nav pinned to the bottom */
  #card{position:fixed;z-index:5;left:10px;right:10px;top:calc(var(--st) + 60px);box-sizing:border-box;padding:10px 12px 10px 12px;
    max-height:46vh;max-height:46dvh;display:flex;flex-direction:column;overflow:hidden}
  #card.lesson{height:46vh;height:46dvh}
  #card.min{height:auto}
  body.wide #card{right:auto;width:460px;max-height:calc(100dvh - 160px)}
  body.wide #card.lesson{height:calc(100dvh - 160px)}
  body.wide #prog{right:auto;width:460px}
  #card .row{display:flex;gap:10px;align-items:center;flex:0 0 auto}
  #card .num{flex:0 0 auto;width:38px;height:38px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;
    font:700 20px/1 var(--serif);background:var(--sun);transform:rotate(-4deg)}
  #card h2{margin:0 52px 0 0;font:700 21px/1.15 var(--serif);letter-spacing:.005em;color:var(--ink)}
  #cscroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;margin-top:8px;padding-right:2px;-webkit-user-select:text;user-select:text}
  #ctext{margin:0;font:17px/1.42 var(--sans);color:#33241A}
  #ctext .sut{display:block;font:700 13px/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--inkFaint);margin-bottom:3px}
  #lesson{margin-top:10px;padding:10px 12px 12px;border:2px dashed rgba(42,28,19,.45);border-radius:12px;background:rgba(251,246,234,.55)}
  #lesson .lhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
  #ltag{font:700 15px/1.2 var(--sans);color:#A8321F;letter-spacing:.02em}
  #lcnt{font:600 14px/1 var(--sans);color:var(--inkFaint);white-space:nowrap}
  #ltext{font:18px/1.48 var(--sans);color:#2A1C13;white-space:pre-line}
  #ltext b{font-weight:700;color:#000}
  #ltext.hands{font-size:17.5px;line-height:1.55}
  #lquiz{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  #lquiz:empty{display:none}
  #lquiz .qo{font:600 17px/1.25 var(--sans);text-align:left;color:var(--ink);background:#FBF6EA;border:2px solid var(--ink);border-radius:14px;padding:11px 13px;cursor:pointer}
  #lquiz .qo.ok{background:#CFE7B8;border-color:#2F7A35}
  #lquiz .qo.no{background:#F3C9BC;border-color:#BF3F2C}
  #lquiz .why{font:17px/1.45 var(--sans);color:#2A1C13;padding:2px 2px 0}
  #lquiz .why b{color:#2F7A35}
  #lnav{flex:0 0 auto;display:flex;gap:8px;align-items:center;margin-top:8px}
  #lnav button{flex:1 1 0;font:700 17px/1 var(--sans);min-height:46px;border:2px solid var(--ink);border-radius:16px;background:var(--paper);color:var(--ink);cursor:pointer;box-shadow:2px 3px 0 rgba(42,28,19,.3)}
  #lnav #lnext{background:#F8D990}
  #lnav button:disabled{opacity:.35;box-shadow:none}
  #lnav button:active{transform:translate(2px,2px);box-shadow:none}
  #lhint{position:sticky;bottom:2px;z-index:2;display:block;margin:10px auto 0;font:700 16px/1 var(--sans);background:#E43D8C;color:#fff;border:2px solid var(--ink);border-radius:18px;padding:10px 16px;box-shadow:2px 3px 0 rgba(42,28,19,.35);cursor:pointer}
  #lhint.off{visibility:hidden}
  #card .ctrls{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  #card .ctrls br{flex-basis:100%;content:"";height:0}
  #card .ctrls label{font:600 16px/1.2 var(--sans);color:var(--inkSoft);display:flex;align-items:center;gap:10px;flex:1 1 100%}
  #card .ctrls label b{font:700 18px/1 var(--sans);color:var(--ink);min-width:52px;text-align:right}
  #card .formula{margin-top:8px;font:italic 15px/1.3 var(--serif);color:var(--inkFaint)}
  #card .formula:empty{display:none}
  #card.min .body{display:none}
  #card .tog{position:absolute;right:8px;top:8px;border:2px solid var(--ink);border-radius:14px;background:var(--paperShade);font:700 18px/1 var(--sans);color:var(--ink);min-width:44px;height:38px;padding:0 10px;cursor:pointer}
  @media (max-width:560px){ #card .formula{display:none} }
  #card .info{font:500 16px/1.4 var(--sans);color:var(--ink);flex:1 1 100%;min-height:1.4em}
  #card .info b{font-weight:700}
  .pulse{outline:3px solid #E43D8C!important;outline-offset:3px;border-radius:12px;animation:hlp 1.1s ease-in-out infinite}
  @keyframes hlp{50%{outline-color:rgba(228,61,140,.25)}}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:34px;background:transparent;margin:0;min-width:80px}
  input[type=range]::-webkit-slider-runnable-track{height:7px;border-radius:4px;background:var(--paperShade);border:1.5px solid var(--ink)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--warm);border:2px solid var(--ink);margin-top:-12px;box-shadow:2px 2px 0 rgba(42,28,19,.35)}
  input[type=range]::-moz-range-track{height:7px;border-radius:4px;background:var(--paperShade);border:1.5px solid var(--ink)}
  input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--warm);border:2px solid var(--ink)}
  .btn{font:600 15px/1.1 var(--sans);color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:20px;padding:10px 13px;min-height:42px;
    box-shadow:2px 3px 0 rgba(42,28,19,.35);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}
  .btn.on{background:var(--sun)}
  .btn.big{flex:1 1 100%;font-size:17px;font-weight:700;background:#F8D990;padding:13px 14px}
  .btn:active{transform:translate(2px,2px);box-shadow:0 1px 0 rgba(42,28,19,.35)}
  .btn:disabled{opacity:.6}

  /* dock */
  #dock{position:fixed;z-index:6;left:10px;right:10px;bottom:calc(var(--sb) + 12px);display:flex;gap:8px;align-items:center;justify-content:flex-end}
  #dock .btn{font-size:16px;padding:12px 14px;min-height:48px}
  #dmic{margin-right:auto;background:#F3C9BC}
  .ic{width:21px;height:21px;margin-right:6px;flex:0 0 auto}
  #dmic.rec{background:var(--red);color:#fff}
  #next{background:var(--sun)!important;font-weight:700!important;font-size:17px!important}
  body.wide #dock{left:auto}
  body.wide #dmic{margin-right:0}

  /* chat */
  #chat{position:fixed;z-index:7;left:8px;right:8px;bottom:calc(var(--sb) + 8px);max-height:64vh;max-height:64dvh;display:flex;flex-direction:column;
    box-sizing:border-box;padding:10px 12px 12px;-webkit-user-select:text;user-select:text}
  body.wide #chat{left:auto;width:520px}
  .chead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .chead b{font:700 21px/1 var(--serif)}
  #cwhere{font:600 15px/1 var(--sans);color:var(--inkSoft);flex:1}
  #cmin{font:700 15px/1 var(--sans);border:2px solid var(--ink);border-radius:16px;background:var(--paperShade);padding:9px 12px;color:var(--ink);cursor:pointer}
  #clog{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:60px;display:flex;flex-direction:column;gap:8px;padding:2px 2px 6px}
  .msg{font:17px/1.45 var(--sans);padding:10px 13px;border-radius:14px;border:2px solid var(--ink);max-width:88%;box-sizing:border-box;color:var(--ink);word-wrap:break-word}
  .msg.q{align-self:flex-end;background:#F8D990;border-bottom-right-radius:4px}
  .msg.a{align-self:flex-start;background:#FBF6EA;border-bottom-left-radius:4px}
  .msg.wait{align-self:flex-start;background:#FBF6EA;color:var(--inkFaint);font-style:italic}
  .msg.err{align-self:flex-start;background:#F3C9BC;color:#6B1E12}
  .msg.hello{align-self:flex-start;background:transparent;border-style:dashed;color:var(--inkSoft);font-size:16px}
  #cstat{font:600 15px/1.3 var(--sans);color:var(--inkSoft);min-height:1.3em;margin:4px 2px 6px}
  .crow{display:flex;gap:8px;margin-bottom:8px}
  #cin{flex:1;font:17px/1.2 var(--sans);padding:11px 12px;border:2px solid var(--ink);border-radius:14px;background:#FBF6EA;color:var(--ink);min-width:0;-webkit-user-select:text;user-select:text}
  #csend{width:52px;font:700 22px/1 var(--sans);border:2px solid var(--ink);border-radius:14px;background:var(--sun);color:var(--ink);cursor:pointer}
  #cmic{width:100%;font-size:18px;font-weight:700;min-height:54px;background:#F3C9BC}
  #cmic.rec{background:var(--red);color:#fff;animation:pulse 1.2s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 6px rgba(191,63,44,.25)}}

  #joy{position:fixed;z-index:4;width:124px;height:124px;border-radius:50%;border:2px dashed rgba(251,246,234,.75);
    background:rgba(42,28,19,.18);display:none;pointer-events:none;transform:translate(-50%,-50%)}
  #knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}
  #hint{position:fixed;z-index:4;left:50%;bottom:calc(var(--sb) + 76px);transform:translateX(-50%);
    font:600 15px/1.35 var(--sans);color:#FBF6EA;text-align:center;text-shadow:0 1px 3px rgba(20,14,30,.9);transition:opacity 1s;pointer-events:none;width:92vw}
  #hint span{display:inline-block;margin:0 8px}
  #fps{position:fixed;right:6px;bottom:4px;z-index:9;font:11px monospace;color:#fff;opacity:.6;display:none}
  @media (max-height:520px) and (orientation:landscape){
    #card{max-height:calc(100dvh - 140px)}
    body #card.lesson{height:calc(100dvh - 140px)}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div>
<div id="grain"></div>
<div id="prog" class="paper"><button id="back" aria-label="назад">‹</button><span id="ptext">начало тропы</span><div id="dots"></div></div>
<div id="card" class="paper">
  <button class="tog" id="tog" aria-label="свернуть">−</button>
  <div class="row"><div class="num" id="cnum">✦</div><h2 id="ctitle">Курс нейросетей</h2></div>
  <div class="body" id="cscroll">
    <p id="ctext"></p>
    <div id="lesson" class="hidden"><div class="lhead"><span id="ltag"></span><span id="lcnt"></span></div><div id="ltext"></div><div id="lquiz"></div></div>
    <button id="lhint" class="hidden"></button>
    <div class="ctrls" id="cctrls"></div><div class="formula" id="cformula"></div>
  </div>
  <div class="body hidden" id="lnav"><button id="lprev">← назад</button><button id="lnext">дальше →</button></div>
</div>
<div id="dock"><button class="btn" id="dmic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z" fill="currentColor"/></svg>спросить</button><button class="btn" id="reopen" style="display:none">💬</button><button class="btn" id="snd">♪</button><button class="btn" id="next">стенд 1 →</button></div>
<div id="chat" class="paper hidden">
  <div class="chead"><b>Прохор</b><span id="cwhere"></span><button id="cmin">свернуть ▾</button></div>
  <div id="clog"><div class="msg hello">Спроси голосом или текстом что угодно про стенд, у которого стоишь. Отвечаю коротко и по-простому.</div></div>
  <div id="cstat"></div>
  <div class="crow"><input id="cin" type="text" maxlength="600" placeholder="или напиши вопрос…" enterkeyhint="send" autocomplete="off"><button id="csend" aria-label="отправить">➤</button></div>
  <button id="cmic" class="btn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z" fill="currentColor"/></svg>нажми и говори</button>
</div>
<div id="joy"><div id="knob"></div></div>
<div id="hint"></div>
<div id="fps"></div>
<script type="module">
import * as THREE from './lib/three.module.js';
import { makeModels } from './models.js';
THREE.ColorManagement.enabled = false;
// ---------------------------------------------------------------------------
// palette (procedural-film house palette + subject tints)
// ---------------------------------------------------------------------------
const PAL = {
  paper: '#EFE3C9', paperShade: '#E2D1B0', paperDeep: '#CDB58C',
  stripeCream: '#F2E7CF', stripeYellow: '#EFDCA3', stripeApricot: '#F0D9B5', stripeSage: '#DCE3CC', stripeSky: '#C9D3D2',
  ink: '#2A1C13', inkSoft: '#5B4331', inkFaint: '#8A735C',
  tan: '#C8A47A', ochre: '#C38F2E', rose: '#C88C86', duskRose: '#E3B1A1', sage: '#94A47F',
  teal: '#3C8783', tealDeep: '#285F5D', sun: '#F1BF4A', nightSky: '#4E3F6E', night: '#2F2748', white: '#FBF6EA',
  orange: '#D8742B', leaf: '#6E8F4F', wood: '#A8784C', red: '#BF3F2C', dusk: '#5A4878',
  navy: '#0B1230', navyLight: '#18234D', grid: '#3A4A86', lavender: '#C8C1EF', lineWhite: '#EEF0FF', paleBlue: '#9CC2EA', glow: '#FFF3DC',
  annBlue: '#3B8EE0', annMagenta: '#E43D8C', annYellow: '#EAB530',
  warm: '#E0782E', warmLight: '#F1BF4A', cold: '#3E8FC4', coldLight: '#9CC2EA', water: '#3C8783', waterLight: '#8CC3BB',
};
const col = (h) => new THREE.Color(h);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
function mulberry(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hash1(i, s) { let h = Math.imul((i | 0) ^ Math.imul(s | 0, 0x9E3779B1), 0x85EBCA6B); h ^= h >>> 13; h = Math.imul(h, 0xC2B2AE35); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function noise1(x, s = 0) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash1(i, s), hash1(i + 1, s), u) * 2 - 1; }
const fmt = (v, d = 2) => v.toFixed(d).replace('.', ',').replace('-', '−');

const IS_TOUCH = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
if (IS_TOUCH) document.body.classList.add('touch');
const Q = new URLSearchParams(location.search);

// ---------------------------------------------------------------------------
// renderer
// ---------------------------------------------------------------------------
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: Q.has('shot') });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
const DPR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(DPR);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.08, 400);
camera.rotation.order = 'YXZ';

// shared uniforms (same objects referenced from every material)
const SH = {
  uTime: { value: 0 },
  uFogColor: { value: col('#EDCFAE') },
  uFogDensity: { value: 0.0095 },
  uLightDir: { value: new THREE.Vector3(0.25, 0.9, 0.38).normalize() },
  uInk: { value: col(PAL.ink) },
  uRes: { value: new THREE.Vector2(1, 1) },
  uDpr: { value: DPR },
};

const GLSL_COMMON = /* glsl */`
  uniform float uTime; uniform vec3 uFogColor; uniform float uFogDensity; uniform vec3 uLightDir; uniform vec3 uInk; uniform vec2 uRes; uniform float uDpr;
  float hash21(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
  float fogAmt(vec3 w){ float d = length(w - cameraPosition); return 1.0 - exp(-pow(d*uFogDensity, 1.5)); }
`;

// ---------------------------------------------------------------------------
// ink material: flat paper colour, cool shadow, screen-space hatching,
// optional uv border (pixel-constant ink edge), grain, fog
// ---------------------------------------------------------------------------
const INK_VS = /* glsl */`
  varying vec3 vN; varying vec3 vW; varying vec2 vUv; varying vec3 vCol;
  void main(){
    mat4 m = modelMatrix;
    #ifdef USE_INSTANCING
      m = m * instanceMatrix;
    #endif
    vCol = vec3(1.0);
    #ifdef USE_INSTANCING_COLOR
      vCol = instanceColor;
    #endif
    vec4 w = m * vec4(position, 1.0);
    vW = w.xyz; vN = normalize(mat3(m) * normal); vUv = uv;
    gl_Position = projectionMatrix * viewMatrix * w;
  }`;
const INK_FS = /* glsl */`
  ${GLSL_COMMON}
  uniform vec3 uColor; uniform sampler2D uMap; uniform float uUseMap; uniform vec2 uRepeat;
  uniform float uHatch, uBorder, uFlat, uOpacity, uAlphaTest, uFog, uEmit;
  varying vec3 vN; varying vec3 vW; varying vec2 vUv; varying vec3 vCol;
  void main(){
    vec3 base = uColor * vCol; float a = uOpacity;
    if (uUseMap > 0.5) { vec4 t = texture2D(uMap, vUv * uRepeat); base *= t.rgb; a *= t.a; }
    if (a < uAlphaTest) discard;
    vec3 N = normalize(vN); if (!gl_FrontFacing) N = -N;
    float l = dot(N, uLightDir) * 0.5 + 0.5;
    vec3 V = normalize(cameraPosition - vW);
    vec3 shade = base * vec3(0.70, 0.66, 0.80);
    float lit = mix(smoothstep(0.24, 0.52, l), 1.0, uFlat);
    vec3 c = mix(shade, base, lit);
    float rim = pow(1.0 - max(dot(N, V), 0.0), 3.0);
    c += vec3(0.22, 0.13, 0.05) * rim * (1.0 - uFlat) * 0.5;
    float px = 1.0 / uDpr;
    float s1 = (gl_FragCoord.x + gl_FragCoord.y) * px / 4.5;
    float line1 = 1.0 - smoothstep(0.2, 0.5, abs(fract(s1) - 0.5) * 2.0);
    float s2 = (gl_FragCoord.x - gl_FragCoord.y) * px / 4.5;

const CENTER = V3(0, 0, -120);
const HILL_SX = 0.3, HILL_SZ = 1.75;
const SUN_DIR = V3(0.10, 0.085, -1).normalize();
// sky dome ------------------------------------------------------------------
const sky = new THREE.Mesh(new THREE.SphereGeometry(300, 48, 24), new THREE.ShaderMaterial({
  uniforms: Object.assign({ uSun: { value: SUN_DIR } }, SH),
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position,1.0); gl_Position = p.xyww; }`,
  fragmentShader: /* glsl */`
    ${GLSL_COMMON}
    uniform vec3 uSun; varying vec3 vDir;
    float h3(vec3 p){ p = fract(p*0.3183099 + 0.1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
    void main(){
      vec3 d = normalize(vDir); float y = d.y;
      vec3 hor = vec3(0.957,0.835,0.655), low = vec3(0.910,0.690,0.600), mid = vec3(0.640,0.490,0.600), high = vec3(0.330,0.270,0.450), top = vec3(0.180,0.150,0.270);
      vec3 c = mix(hor, low, smoothstep(0.0, 0.09, y));
      c = mix(c, mid, smoothstep(0.07, 0.28, y));
      c = mix(c, high, smoothstep(0.25, 0.58, y));
      c = mix(c, top, smoothstep(0.55, 1.0, y));
      // diagonal paper bands, like the stripe plate
      float az = atan(d.x, d.z);
      float band = fract(az * 3.0 + y * 7.0 + 0.04 * sin(az * 23.0));
      c *= 1.0 + 0.035 * smoothstep(0.45, 0.5, band) * (1.0 - smoothstep(0.95, 1.0, band)) * (1.0 - smoothstep(0.1, 0.6, y));
      // sun: flat disc, ink ring, warm bloom
      float ang = acos(clamp(dot(d, uSun), -1.0, 1.0));
      c += vec3(0.95, 0.62, 0.25) * 0.28 * exp(-ang * 5.0);
      c = mix(c, vec3(0.972, 0.800, 0.380), 1.0 - smoothstep(0.052, 0.055, ang));
      c = mix(c, vec3(0.99, 0.90, 0.62), (1.0 - smoothstep(0.030, 0.040, ang)) * 0.6);
      c = mix(c, vec3(0.45, 0.25, 0.18), (1.0 - smoothstep(0.0, 0.0022, abs(ang - 0.055))) * 0.55);
      // protractor around the sun
      vec3 t1 = normalize(cross(uSun, vec3(0.0,1.0,0.0))); vec3 t2 = cross(t1, uSun);
      float a2 = atan(dot(d, t2), dot(d, t1));
      float ring = 1.0 - smoothstep(0.0, 0.0016, abs(ang - 0.15));
      float tick = step(fract(a2 / 6.2831853 * 72.0 + 0.5), 0.1) * step(0.15, ang) * step(ang, 0.162);
      float tickL = step(fract(a2 / 6.2831853 * 12.0 + 0.5), 0.02) * step(0.15, ang) * step(ang, 0.178);
      float arcMask = smoothstep(-0.2, 0.3, dot(d - uSun, vec3(0.0,1.0,0.0)) + 0.2);
      c = mix(c, vec3(0.30, 0.43, 0.78), (ring + max(tick, tickL)) * 0.55 * arcMask);
      float ring2 = 1.0 - smoothstep(0.0, 0.0012, abs(ang - 0.26));
      c = mix(c, vec3(0.93, 0.93, 1.0), ring2 * 0.18);
      // stars
      vec3 q = d * 160.0; vec3 id = floor(q); float hs = h3(id);
      if (hs > 0.975) { vec3 f = fract(q) - 0.5; float s = length(f); float tw = 0.6 + 0.4 * sin(uTime * (1.0 + hs * 3.0) + hs * 40.0);
        c = mix(c, vec3(1.0, 0.96, 0.86), (1.0 - smoothstep(0.04, 0.12, s)) * smoothstep(0.22, 0.55, y) * tw); }
      if (y < 0.0) c = mix(hor, vec3(0.91, 0.82, 0.66), smoothstep(0.0, -0.08, y));
      c += (hash21(floor(gl_FragCoord.xy / uDpr)) - 0.5) * 0.035;
      gl_FragColor = vec4(c, 1.0);
    }`,
  side: THREE.BackSide, depthWrite: false,
}));

// paper-cut hills: three rings of silhouettes with ink edges ---------------------
function hillRing(R, base, amp, color, seed, edge) {
  const n = 160, pos = [], idx = [], top = [];
  for (let i = 0; i <= n; i++) {
    const a = i / n * TAU;
    const hgt = base + amp * (0.55 * (noise1(a * 3.2, seed) * 0.5 + 0.5) + 0.35 * (noise1(a * 9.0, seed + 1) * 0.5 + 0.5) + 0.1 * noise1(a * 30, seed + 2));
    const x = Math.sin(a) * R, z = Math.cos(a) * R;
    pos.push(x, -2, z, x, hgt, z); top.push(V3(x, hgt, z));
    if (i < n) { const k = i * 2; idx.push(k, k + 2, k + 1, k + 1, k + 2, k + 3); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(new Array(pos.length).fill(0).map((_, i) => (i % 3 === 1 ? 1 : 0)), 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(new Array((n + 1) * 4).fill(0), 2));
  g.setIndex(idx);
  const m = new THREE.Mesh(g, inkMat({ color, flat: 1, hatch: 0, side: THREE.DoubleSide }));
  m.position.copy(CENTER); m.scale.set(HILL_SX, 1, HILL_SZ); scene.add(m);
  const l = new Line(n + 2, { width: edge, color: PAL.ink, minPx: 1.2, boil: 0.5, seed });
  l.set(top); l.mesh.position.copy(CENTER); l.mesh.scale.set(HILL_SX, 1, HILL_SZ); scene.add(l.mesh);
}

const BB_VS = /* glsl */`
  uniform float uCell; varying vec2 vUv; varying vec3 vW;
  void main(){
    vec3 ip = (modelMatrix * instanceMatrix * vec4(0.0,0.0,0.0,1.0)).xyz;
    float sc = length(instanceMatrix[0].xyz);
    vec3 cd = cameraPosition - ip; cd.y = 0.0; cd = normalize(cd);
    vec3 right = vec3(cd.z, 0.0, -cd.x);
    vec3 w = ip + right * position.x * sc + vec3(0.0,1.0,0.0) * position.y * sc;
    vW = w; vUv = vec2((uv.x + uCell) / 4.0, uv.y);
    gl_Position = projectionMatrix * viewMatrix * vec4(w, 1.0);
  }`;
const BB_FS = /* glsl */`${GLSL_COMMON} uniform sampler2D uMap; varying vec2 vUv; varying vec3 vW;
  void main(){ vec4 t = texture2D(uMap, vUv); if (t.a < 0.5) discard; vec3 c = t.rgb + (hash21(floor(gl_FragCoord.xy/uDpr)) - 0.5) * 0.04; gl_FragColor = vec4(mix(c, uFogColor, fogAmt(vW)), 1.0); }`;
function billboards(cell, list, w, h) {
  const geo = new THREE.PlaneGeometry(w, h); geo.translate(0, h / 2, 0);
  const m = new THREE.InstancedMesh(geo, new THREE.ShaderMaterial({ uniforms: Object.assign({ uMap: { value: atlas }, uCell: { value: cell } }, SH), vertexShader: BB_VS, fragmentShader: BB_FS, side: THREE.DoubleSide }), list.length);
  const M = new THREE.Matrix4();
  list.forEach(([x, z, s], i) => { M.makeScale(s, s, s); M.setPosition(x, 0, z); m.setMatrixAt(i, M); });
  m.frustumCulled = false; m.raycast = () => {};
  scene.add(m); return m;
}

const AUDIO = (() => {
  let ctx = null, master, bus, padGain, on = false, lastPluck = 0;

  function init() {

    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3;
    master.connect(comp); comp.connect(ctx.destination);
    bus = ctx.createGain(); bus.gain.value = 1; bus.connect(master);
