<script type="module">
import * as THREE from './lib/three.module.js';

// ---- дорожки и рисунки --------------------------------------------------
const LAYERS=[
  {id:'drum',name:'Рамочный',col:0xffb347},
  {id:'kick',name:'Бочка',col:0x9cff6a},
  {id:'snare',name:'Рабочий',col:0xede9ff},
  {id:'shaker',name:'Шейкер',col:0x6fe3ff},
  {id:'bass',name:'Бас',col:0xff6fa8,notes:6},
  {id:'harp',name:'Арфа',col:0x8fb8ff,notes:10}];
const STEPS=16, pat=LAYERS.map(()=>new Float32Array(STEPS));
const set=(l,steps,v=.8)=>{pat[l].fill(0);steps.forEach(s=>pat[l][s]=v)};
const RH={ 'Тресильо':[0,6,12], 'Клаве 3-2':[0,3,6,10,12], 'Румба':[0,3,7,10,12], 'Синквильо':[0,4,6,10,12] };
let active=0, bpm=96;
// 03.11.2026, слово Влада: на старте круг пустой, ритм ставит человек
// минорная пентатоника от ре
const hz=m=>440*Math.pow(2,(m-69)/12);
const BASS=[38,41,43,45,48,50], HARP=[62,65,67,69,72,74,77,79,81,84], BHARP=[38,41,43,45,48,50];

// ---- звук ---------------------------------------------------------------
let ac,out,noise,kbuf={};
function ks(f,dur,b){const sr=ac.sampleRate,n=Math.round(sr/f),len=Math.floor(sr*dur),B=ac.createBuffer(1,len,sr),d=B.getChannelData(0),r=new Float32Array(n);
  let p=0;for(let i=0;i<n;i++){p=p*(1-b)+(Math.random()*2-1)*b;r[i]=p}
  let k=0,dec=.9965+Math.min(.0034,f/90000*-1+.0034);
  for(let i=0;i<len;i++){const j=(k+1)%n,v=r[k];d[i]=v;r[k]=(v+r[j])*.5*dec;k=j}
  B.rate=f*n/sr;return B}
let peakA,peakD;
function initAudio(){if(ac){if(ac.state!=='running')ac.resume();return}
  ac=new (window.AudioContext||window.webkitAudioContext)();
  const c=ac.createDynamicsCompressor();c.threshold.value=-16;c.ratio.value=4;
  const lim=ac.createDynamicsCompressor();lim.threshold.value=-4;lim.knee.value=0;lim.ratio.value=20;lim.attack.value=.002;lim.release.value=.12;
  out=ac.createGain();out.gain.value=.55;out.connect(c);c.connect(lim);lim.connect(ac.destination);ac.resume();
  peakA=ac.createAnalyser();peakA.fftSize=2048;peakD=new Float32Array(2048);lim.connect(peakA);
  const sr=ac.sampleRate,I=ac.createBuffer(2,sr*2.4,sr);
  for(let ch=0;ch<2;ch++){const d=I.getChannelData(ch);let lp=0;for(let i=0;i<d.length;i++){lp+=.35*((Math.random()*2-1)-lp);d[i]=lp*Math.pow(1-i/d.length,3)}}
  const v=ac.createConvolver();v.buffer=I;const g=ac.createGain();g.gain.value=.3;out.connect(g);g.connect(v);v.connect(c);
  noise=ac.createBuffer(1,sr,sr);const nd=noise.getChannelData(0);for(let i=0;i<sr;i++)nd[i]=Math.random()*2-1;
  HARP.forEach(m=>kbuf[m]=ks(hz(m),2.6,.75));BHARP.forEach(m=>kbuf['b'+m]=ks(hz(m),3.4,.45));
  nextT=ac.currentTime+.08;timer=setInterval(tick,25)}
function env(g,t,a,d){g.gain.setValueAtTime(a,t);g.gain.exponentialRampToValueAtTime(.0008,t+d)}
function tone(type,f0,f1,t,a,d){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+d*.6);env(g,t,a,d);o.connect(g);g.connect(out);o.start(t);o.stop(t+d+.02)}
function hiss(ft,fr,t,a,d){const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noise;s.loop=true;f.type=ft;f.frequency.value=fr;env(g,t,a,d);s.connect(f);f.connect(g);g.connect(out);s.start(t,Math.random()*.8);s.stop(t+d+.02)}
const VOICE={
  kick(t,l){tone('sine',150,44,t,1.1*l,.3)},
  snare(t,l){hiss('bandpass',1900,t,.8*l,.17);tone('triangle',200,150,t,.3*l,.1)},
  shaker(t,l){hiss('highpass',6500,t,.34*l,.055)},
  drum(t,l){if(l>.6){tone('sine',112,76,t,.95*l,.4);hiss('lowpass',900,t,.2*l,.03)}else{tone('triangle',540,390,t,.42+.3*l,.08);hiss('bandpass',2600,t,.3*l,.04)}},
  harp(t,l){pluck(HARP[Math.max(0,Math.min(9,Math.round(l*10)-1))],.6,t)},
  bass(t,l){const m=BASS[bassIdx(l)],o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();o.type='sawtooth';o.frequency.value=hz(m);f.type='lowpass';f.frequency.setValueAtTime(900,t);f.frequency.exponentialRampToValueAtTime(180,t+.3);env(g,t,.55,.5);o.connect(f);f.connect(g);g.connect(out);o.start(t);o.stop(t+.52)}
};
const bassIdx=l=>Math.max(0,Math.min(5,Math.round(l*6)-1));
function pluck(key,loud,t){if(!ac||!kbuf[key])return;const s=ac.createBufferSource(),g=ac.createGain();s.buffer=kbuf[key];s.playbackRate.value=kbuf[key].rate;g.gain.value=loud;s.connect(g);g.connect(out);s.start(t||0)}
function click(){if(ac)tone('sine',880,0,ac.currentTime,.12,.05)}
let nextT=0,step=0,timer,events=[];
function tick(){const sd=60/bpm/4;while(nextT<ac.currentTime+.12){
  LAYERS.forEach((L,i)=>{const v=pat[i][step];if(v>0){VOICE[L.id](nextT,L.notes?v:.45+.55*v);events.push({t:nextT,l:i,s:step})}});
  events.push({t:nextT,l:-1,s:step});step=(step+1)%STEPS;nextT+=sd}}

// ---- сцена --------------------------------------------------------------
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.xr.enabled=true;renderer.xr.setReferenceSpaceType('local-floor');
if(renderer.xr.setFramebufferScaleFactor)renderer.xr.setFramebufferScaleFactor(.9);
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x020403);
const TH={koltsa:{tint:[1.15,.95,.7],side:0x2a1a0e,leg:0x1e130a,line:0xc98a3c,ring:0xe0a050,fog:0xffb060,dark:.62,btn:1.1},kamen:{tint:[.72,1,.98],side:0x24282a,leg:0x191d1e,line:0x8fd8e8,ring:0xbdf0ff,fog:0x7fb8c8,dark:.72,btn:1.5}}[window.THEME];
const txl=new THREE.TextureLoader(),tex=n=>{const t=txl.load('t/'+n+'.jpg');t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t};
const texDisk=tex('disk'),texBtn=tex('knopka');
const camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,.03,120);
// 03.11.2026, слово Влада: при подходе видно и лес, и пень, и кнопки; на узком экране стоим дальше
const NARROW=innerWidth/innerHeight<1,BACK=NARROW?1.55:.55;camera.position.set(0,1.55+BACK*.4,.62+BACK);
// 03.11.2026, слово Влада: подошёл к пню или тыкнул кнопку издалека, камера сама встаёт туда, где удобно натыкивать (как в саду Жоры)
const PZ=-.38,DOCK_R=4.5;let fly=null,walked=0,idle=0;
function dockPose(){const n=innerWidth/innerHeight<1,z=n?1.85:.95;return{x:0,z,pitch:Math.atan2(.93-1.55,z-PZ)+(n?.05:.04)}}
function dock(){const D=dockPose(),dx=camera.position.x-D.x,dz=camera.position.z-D.z,T=Math.PI*2;let dy=(-yaw)%T;if(dy>Math.PI)dy-=T;if(dy<-Math.PI)dy+=T;
  if(Math.hypot(dx,dz)<.03&&Math.abs(dy)<.02&&Math.abs(D.pitch-pitch)<.02)return false;
  fly={t:0,x:camera.position.x,z:camera.position.z,y0:yaw,p0:pitch,D,dy,dur:Math.min(1.6,.6+Math.hypot(dx,dz)*.25)};return true}
const offDock=()=>{const D=dockPose();return Math.hypot(camera.position.x-D.x,camera.position.z-D.z)>.5};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);if(!renderer.xr.isPresenting&&!offDock())dock()});

const rng=(s=>()=>(s=(s*16807)%2147483647)/2147483647)(7321);
const R=(a,b)=>a+(b-a)*rng();
const sm=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)};
const H=(x,z)=>{const r=Math.hypot(x,z);return sm(1.6,6,r)*(.34*Math.sin(.62*x+1)*Math.cos(.55*z)+.16*Math.sin(1.4*z+x*.7))};

const P=[],C=[],K=[],S=[],Z=[],D=[];
const pt=(x,y,z,c,k,s,d)=>{P.push(x,y,z);C.push(c[0],c[1],c[2]);K.push(k);S.push(rng());Z.push(s);d=d||[0,1,0];D.push(d[0],d[1],d[2])};
// мох
for(let i=0;i<27000;i++){const r=13*Math.pow(rng(),.72)+.1,a=rng()*6.283,x=Math.cos(a)*r,z=Math.sin(a)*r,g=R(.35,1),w=rng()<.05?.8:.1;
  pt(x,H(x,z)+R(0,.05),z,[.2*g+w,.62*g+w*.7,.12*g+w*.3],0,R(.012,.026))}
for(let i=0;i<9000;i++){const r=R(13,58),a=rng()*6.283,x=Math.cos(a)*r,z=Math.sin(a)*r,g=R(.3,.9);pt(x,H(x,z)+R(0,.06),z,[.22*g,.58*g,.3*g],0,R(.03,.06))}
// стволы
const trunks=[];
for(let i=0;i<32;i++){const a=rng()*6.283,r=R(3.2,13),x=Math.cos(a)*r,z=Math.sin(a)*r,tr=R(.13,.3);trunks.push([x,H(x,z),z,tr]);
  for(let j=0;j<400;j++){const f=rng()*6.283,h=Math.pow(rng(),1.7)*12,lit=Math.max(.15,Math.cos(f-a-3.14));pt(x+Math.cos(f)*tr,H(x,z)+h,z+Math.sin(f)*tr,[.75*lit,.8*lit,.7*lit],1,R(.014,.03),[Math.cos(f),0,Math.sin(f)])}}
// дальние деревья рядами: тёмные колонны и светящаяся кора
const farT=[];
for(let i=0;i<110;i++){const a=rng()*6.283,r=14+44*Math.pow(rng(),.8),x=Math.cos(a)*r,z=Math.sin(a)*r,tr=R(.28,.75),hh=R(16,30),warm=rng()<.3;farT.push([x,z,tr,hh]);
  for(let j=0;j<120;j++){const f=a+3.14+R(-1.2,1.2),h=Math.pow(rng(),1.5)*hh,lit=Math.pow(Math.max(0,Math.cos(f-a-3.14)),2)*R(.4,1);pt(x+Math.cos(f)*tr*(1-h/hh*.6),H(x,z)+h,z+Math.sin(f)*tr*(1-h/hh*.6),warm?[1*lit,.62*lit,.3*lit]:[.42*lit,.8*lit,.72*lit],1,R(.05,.09),[Math.cos(f),0,Math.sin(f)])}
  for(let j=0;j<36;j++){const f=rng()*6.283,e=rng(),h=hh*(.55+.45*e),q=(1-e)*R(1.2,3.4);pt(x+Math.cos(f)*q,H(x,z)+h,z+Math.sin(f)*q,warm?[.5,.34,.16]:[.14,.34,.3],1,R(.06,.11),[Math.cos(f),0,Math.sin(f)])}}
// камни
const rocks=[];
for(let i=0;i<7;i++){const a=rng()*6.283,r=R(2.2,7),x=Math.cos(a)*r,z=Math.sin(a)*r,s=R(.3,.8);rocks.push([x,H(x,z)+s*.2,z,s]);
  for(let j=0;j<850;j++){const v=new THREE.Vector3(R(-1,1),R(-.2,1),R(-1,1)).normalize().multiplyScalar(s);v.y*=.68;const b=.25+.75*Math.max(0,v.y/s);pt(x+v.x,H(x,z)+s*.2+v.y,z+v.z,[b*.9,b*.92,b*.8],2,R(.012,.026),[v.x/s,v.y/s,v.z/s])}}
// папоротники
for(let i=0;i<30;i++){const a=rng()*6.283,r=R(1.5,6.5),x=Math.cos(a)*r,z=Math.sin(a)*r;
  for(let f=0;f<7;f++){const d=f/7*6.283+R(-.2,.2),L=R(.35,.65);for(let j=0;j<24;j++){const t=j/23,q=t*L;pt(x+Math.cos(d)*q+R(-.01,.01),H(x,z)+Math.sin(t*2.5)*L*.42,z+Math.sin(d)*q+R(-.01,.01),[.45,1,.25],3,.02)}}}
// светлячки
for(let i=0;i<260;i++){const a=rng()*6.283,r=R(1.2,9);pt(Math.cos(a)*r,R(.7,3.4),Math.sin(a)*r,[1,.75,.28],4,R(.03,.06))}
// звёзды
for(let i=0;i<1400;i++){const a=rng()*6.283,e=R(.35,1.45),r=75;pt(Math.cos(a)*Math.cos(e)*r,Math.sin(e)*r+2,Math.sin(a)*Math.cos(e)*r,[.75,.85,1],5,R(.1,.2))}

const pg=new THREE.BufferGeometry();
pg.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
pg.setAttribute('aCol',new THREE.Float32BufferAttribute(C,3));
pg.setAttribute('aKind',new THREE.Float32BufferAttribute(K,1));
pg.setAttribute('aSeed',new THREE.Float32BufferAttribute(S,1));
pg.setAttribute('aSize',new THREE.Float32BufferAttribute(Z,1));
pg.setAttribute('aDir',new THREE.Float32BufferAttribute(D,3));
const PAL=LAYERS.map(L=>new THREE.Color(L.col));
const U={uT:{value:0},uF:{value:0},uK:{value:0},uS:{value:0},uSn:{value:0},uH:{value:0},uD:{value:0},uB:{value:0},uA:{value:0},uM:{value:0},uRec:{value:0},uKeep:{value:1},uTint:{value:new THREE.Vector3(...TH.tint)},uScale:{value:900},
  uR:{value:Array.from({length:16},()=>new THREE.Vector4(0,0,-99,0))},uP:{value:PAL}};
const WHITE=new THREE.Color(0xffffff);
const pm=new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
vertexShader:`attribute vec3 aCol,aDir;attribute float aKind,aSeed,aSize;
uniform float uT,uF,uK,uS,uSn,uH,uD,uB,uA,uM,uRec,uKeep,uScale;uniform vec3 uTint;uniform vec4 uR[16];uniform vec3 uP[6];varying vec3 vC;
void main(){if(aKind<1.5&&aSeed>uKeep){gl_Position=vec4(2.,2.,2.,1.);gl_PointSize=0.;vC=vec3(0.);return;}vec3 p=position,c=aCol;float g=1.;
 if(aKind<.5){c*=uTint;c=mix(c,c.gbr*1.1,uM*.3);g+=uB*.8*aSeed+uK*.25;
  for(int i=0;i<16;i++){float a=uT-uR[i].z;if(a<8.){float d=length(p.xz-uR[i].xy),w=d-a*5.5,e=exp(-w*w*1.4)*(1.-a/8.);c+=uP[int(uR[i].w)]*e*1.6;p.y+=e*.34;}}
  p.y+=sin(p.x*1.1+uT*2.)*sin(p.z*.9-uT*1.6)*.05*uB;}
 else if(aKind<1.5){float w=p.y-uSn*13.;float e=exp(-w*w*.45)*uS;g+=e*5.+uK*.3;c=mix(c,vec3(1.,.95,1.),e);p+=aDir*e*.05*step(.4,aSeed);p.xz+=aDir.xz*uK*.03*aSeed;}
 else if(aKind<2.5){g+=uD*2.6;p+=aDir*uD*(.1+aSeed*.22);c=mix(c,uP[0],uD*.7);}
 else if(aKind<3.5){p.x+=sin(uT*.9+aSeed*6.)*.06*position.y;p.y+=uA*.16*position.y;g+=uA*3.5;c=mix(c,uP[5],uA*.6);}
 else if(aKind<4.5){p+=vec3(sin(uF*.3+aSeed*40.),.5*sin(uF*.21+aSeed*17.),cos(uF*.27+aSeed*29.))*(.9+uH*.5+uB*.6);g=.5+.5*sin(uT*1.6+aSeed*50.)+uH*3.;}
 else{g=.45+.3*sin(uT*.8+aSeed*80.)+uB*1.2+uA*1.3*step(.6,aSeed);p.y+=sin(uT*.1+aSeed*9.)*.3;c=mix(c,uP[5],uA*.5);}
 c=mix(c,c*vec3(1.25,.72,.72),uRec*.5);
 vec4 mv=modelViewMatrix*vec4(p,1.);float z=-mv.z;
 float fz=smoothstep(6.,50.,z);if(aKind<4.5)c=mix(c,vec3(.2,.34,.36)*(.4+uB*.5+uK*.25),fz*.55);vC=c*g*(aKind>4.5?1.:(1.-fz*.93));
 gl_PointSize=clamp(aSize*uScale*(1.+.25*min(g,3.))/z,1.,22.);gl_Position=projectionMatrix*mv;}`,
fragmentShader:`varying vec3 vC;void main(){float d=length(gl_PointCoord-.5);float a=smoothstep(.5,.08,d);gl_FragColor=vec4(vC*a,a);}`});
const forest=new THREE.Points(pg,pm);forest.frustumCulled=false;scene.add(forest);

// тёмная земля, стволы и камни, чтобы точки лежали на чём-то
const dark=new THREE.MeshBasicMaterial({color:0x030604});
let groundM,trunkM,rockM;
{const g=new THREE.PlaneGeometry(130,130,110,110);g.rotateX(-Math.PI/2);const p=g.attributes.position;for(let i=0;i<p.count;i++)p.setY(i,H(p.getX(i),p.getZ(i))-.02);groundM=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0x061006}));scene.add(groundM);
 const t=new THREE.InstancedMesh(new THREE.CylinderGeometry(1,1,1,8,1,true),dark,trunks.length),m=new THREE.Matrix4();
 trunks.forEach(([x,y,z,r],i)=>{m.makeScale(r*.97,14,r*.97);m.setPosition(x,y+7,z);t.setMatrixAt(i,m)});scene.add(t);trunkM=t;
 const k=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1,1),dark,rocks.length);
