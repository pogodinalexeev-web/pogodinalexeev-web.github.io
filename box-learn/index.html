<head>

<title>Бесконечный бокс — обучалка, главы 1–5</title>
<!--
  Обучалка бесконечного бокса, этап 1 (29.09.2026, слово Влада 01:43: «первый этап это без 1 и 2 струн в миноре
  одна палка дальше та которая выше или ниже»; 05:41: «убери всё лишнее и делай обучалку как договорились»).
  Только струны 6-3, только натуральный минор. Палки: R ●·●● (пара справа), W ●·●·● (широкая), L ●●·● (пара слева); слово Влада 05:55 «давай английские l r», W за широкую предложил ассистент.
  Номер и цвет относительно дома (Влад 06:03, 06:05): дом это минорная тоника, палка 1 красная, дальше по стенке вверх (по квартам) 2..7 радугой;
  в параллельном мажоре имена НЕ переопределяются, дом остаётся минорной тоникой (в до мажоре от ля палка 1, от до палка 4).
  Этап 2 (слово Влада 05:51 «давай второй этап»): к стенке от тоники пристраиваются соседки вправо и влево на тех же четырёх струнах.
  Главы (слово Влада 01.10.2026 17:34 «давай добавим главу… вправо теперь влево и теперь трансформация а дальше сдвиг перед каждой главой обучалка своя»;
  17:35 «сдвиг типа 5 стрелка по диагонали вверх 6… отдельно глава сдвиг с пометкой gh», «Транс последняя сдвиг перед ней»):
  1 Стенка, 2 Вправо, 3 Влево, 4 Трансформация (рамка палки едет на одну ноту вбок, палка становится другой),
  5 Исключения (5 → 6 вверх уезжает на лад вправо; стык 3-й и 2-й струны, метка GB, всё уезжает на лад вправо). Перед каждой главой своё вступление.
  17:46 «Отдельно блок про исключения там оба сдвига в конце и вот и вся метода»: глава сдвигов стала последней.
  Переделка 02.10.2026 («Да» Влада 09:06 на пакет из реплик 01.10 18:31, 18:33, 18:36, 20:00):
  · номер палки не вход, а выход: задание «продолжай гамму» / «три ноты назад», номер и форму гриф называет сам (20:00 «выеби ты эту методологию»);
  · струна и порядок любые, вместо «на 6-й струне» пишется «осталось N» (18:31 «на любой, на какой человек хочет, он такой ставит»);
  · кнопок R/W/L нет, под заданием постоянная таблица семи палок и кнопка «Подсказка» (18:31 «должна быть вот эта табличка… подсказка одной кнопкой»);
  · трансформация прокруткой: рамку тащишь по струне, она липнет к нотам гаммы и только к нужной, прилипла = засчитано (18:36);
  · знак трансформации «равно со стрелкой»: 1 ⇒ 6 и 3 ⇐ 1, результат с той стороны, куда уехала рамка (18:33);
  · у «Влево» свой ролик, зеркальный «Вправо», и призрачная 7-я струна под 6-й, чтобы «та, что под ней» была видна и внизу.
  Большой бокс с библиотекой ладов живёт отдельно: /demo/box/.
-->
<style>
:root{--bg:#101218;--pan:#1a1d26;--ink:#e9e6df;--dim:#8d90a0;--line:#3a3e4c;--ok:#4cc38a;--bad:#ef5b5b;--home:#f2b134;
  --P:#5aa9ff;--Sh:#b58cff;--L:#ff8a5c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:12px 12px 28px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:16px;margin:0;font-weight:650;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key{white-space:nowrap}
.key{font-size:15px;color:var(--home);font-weight:650}
.lv{display:flex;gap:6px;margin:8px 0 0;overflow-x:auto}
#lv1{margin-top:12px}#lv2{margin-bottom:10px}
.lv button{flex:1;min-width:0;padding:7px 2px;border-radius:10px;border:1px solid var(--line);background:var(--pan);color:var(--ink);font-size:11px;line-height:1.2}
.lv button.on{border-color:var(--home);background:#2a2415}
.lv button:disabled{opacity:.35}
.lv b{display:block;font-size:13px}
.task{background:var(--pan);border-radius:14px;padding:12px 14px;min-height:74px}
.task .q{font-size:17px;font-weight:600}
.task .rule{color:var(--dim);font-size:14px;margin-top:4px}
.task .rule.good{color:var(--ok)}
.task .rule.warn{color:var(--bad)}
/* таблица семи палок: номер, цвет, форма точками. Всегда на виду, угадывать форму не надо (слово Влада 01.10.2026 18:31) */
.tbl{display:flex;gap:4px;margin-top:8px}
.tbl div{flex:1;text-align:center;border-radius:10px;padding:4px 0 3px;border:2px solid transparent;background:var(--pan);transition:border-color .2s}
.tbl b{display:block;font-size:19px;line-height:1.1}
.tbl small{font-size:10px;letter-spacing:1px;color:var(--dim);white-space:nowrap}
.tbl div.hl{border-color:#fff;background:#2a2d38}
svg{width:100%;height:auto;display:block;margin:10px 0 6px;touch-action:manipulation;user-select:none}
.fret{stroke:#5a5f70;stroke-width:3}
.str{stroke:#b9b2a3}
.str.g7{stroke-dasharray:7 7;opacity:.45}
.fnum{fill:var(--dim);font-size:19px;text-anchor:middle}
.snum{fill:var(--dim);font-size:19px;text-anchor:middle}
.snum.g7{opacity:.5}
.lane{fill:rgba(242,177,52,.07);stroke:rgba(242,177,52,.3);stroke-dasharray:6 5}
.lane.hl{fill:rgba(242,177,52,.18);stroke:rgba(242,177,52,.9)}
.cap{stroke-width:2.5}
.capname{font-size:24px;font-weight:700;text-anchor:middle}
.n circle{stroke:#000;stroke-width:1.5}
.n text{font-size:17px;font-weight:700;text-anchor:middle;fill:#111}
.n.ok circle{fill:var(--ok)}
.n.home circle{fill:var(--home)}
.n.built circle{fill:#d8d3c7}
.n.bad circle{fill:var(--bad)}
.n.scale circle{fill:#2b2e3a;stroke:#5a5f70}
.n.g7 circle{opacity:.5}
.cell{fill:transparent;cursor:pointer}
.row{display:flex;gap:8px;margin-top:10px;align-items:center}
.row button{padding:11px 14px;border-radius:12px;border:0;background:var(--home);color:#1a1405;font-weight:700;font-size:16px}
.row button.ghost{background:var(--pan);color:var(--ink);border:1px solid var(--line)}
.stat{color:var(--dim);font-size:13px;margin-left:auto;text-align:right}
.hide{display:none!important}

/* онбординг (слово Влада 06:10: «вот я открыл нихуя не знаю что за палке») */
.ob{position:fixed;inset:0;background:rgba(10,12,18,.96);z-index:9;display:flex;flex-direction:column;justify-content:center;padding:20px}
.ob .card{background:var(--pan);border-radius:18px;padding:18px 18px 14px;max-width:520px;margin:0 auto;width:100%;max-height:92vh;overflow-y:auto}
.ob h2{margin:0 0 10px;font-size:20px}
.ob p{margin:8px 0;font-size:16px;line-height:1.45}
.ob .pic{font-size:26px;letter-spacing:4px;margin:4px 0 2px}
.ob .pic b{display:inline-block;width:52px;letter-spacing:0;font-size:22px}
.ob .rb{display:flex;gap:6px;margin:8px 0}
.ob .rb span{flex:1;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#111;font-size:13px}
.ob .nav{display:flex;gap:8px;margin-top:14px;align-items:center}
.ob .nav button{padding:11px 18px;border-radius:12px;border:0;background:var(--home);color:#1a1405;font-weight:700;font-size:16px}
.ob .nav button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
.ob .dots{margin-left:auto;color:var(--dim);font-size:14px}
.ob .map{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px -6px;padding:0 6px;border-radius:12px;background:#12141b}
.ob .map svg{height:auto;display:block;margin:0}
.ob .map.wide svg{width:1300px}
.ob .map.mid svg{width:640px}
.ob .plane{height:330px;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:contain;cursor:grab;position:relative}
.ob .plane svg{width:100%;height:100%;display:block}
.ob .plane .badge{position:absolute;right:8px;top:6px;color:var(--dim);font-size:13px;background:rgba(0,0,0,.4);padding:2px 8px;border-radius:8px}
.ob .map.small svg{width:100%}
.ob .scrl{color:var(--dim);font-size:13px;margin:0 0 4px}
/* ролик соседки: копия палки съезжает по диагонали на соседнюю струну и встаёт рядом (вправо: сверху вниз-вправо; влево: снизу вверх-влево) */
.ob .mv{animation:slide 3.2s ease-in-out infinite}
@keyframes slide{0%,14%{transform:translate(0,0);opacity:0}24%{opacity:1;transform:translate(0,0)}68%,88%{transform:translate(var(--dx),var(--dy));opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
.help{flex:none;border:1px solid var(--line);background:var(--pan);color:var(--dim);border-radius:50%;width:30px;height:30px;font-size:16px;font-weight:700}
/* вспышка и подсветка свежей палки, перенесены из большого бокса (слово Влада 06:23: «хайлайты как в старой версии») */
#flash{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;pointer-events:none;background:rgba(3,5,8,.6);opacity:0;transition:opacity .25s}
#flash.on{opacity:1}
#flash .t{font-size:min(22vw,170px);font-weight:800;letter-spacing:.04em;color:#fff;text-shadow:0 0 40px rgba(255,255,255,.35);transform:scale(.6);transition:transform .35s cubic-bezier(.2,1.5,.4,1);white-space:nowrap;text-align:center}
#flash.on .t{transform:scale(1)}
#flash .d{font-size:min(5vw,26px);color:var(--dim);text-align:center;margin-top:6px}
.cap.new{animation:grow .5s ease-out}
.n.new circle{animation:pop .45s ease-out}
@keyframes grow{0%{opacity:0;stroke-width:9}100%{opacity:1}}
@keyframes pop{0%{r:5}60%{r:26}100%{r:21}}
.row button.ghost.off{opacity:.45}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .25s 2}
.cap.ghost{stroke-dasharray:6 6;opacity:.55;fill:none!important}
.cap.drag{stroke-width:4;fill:rgba(255,255,255,.12)!important}
.gb{fill:var(--home);font-size:15px;font-weight:800;text-anchor:middle}
.gbl{stroke:rgba(242,177,52,.55);stroke-dasharray:4 7;stroke-width:2}
.ob .chain{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0;font-size:18px;color:var(--dim)}
.ob .chain span{width:34px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#111}
</style>

<body>
<div id="flash"><div><div class="t" id="flashT"></div><div class="d" id="flashD"></div></div></div>
<div class="ob hide" id="ob"><div class="card" id="obc"></div></div>
<div class="wrap">
  <header><h1 id="ttl">Бесконечный бокс · этап 1</h1><div class="key" id="key"></div><button class="help" id="help">?</button></header>
  <div class="lv" id="lv1"></div>
  <div class="lv" id="lv2"></div>
  <div class="task"><div class="q" id="q"></div><div class="rule" id="rule"></div></div>
  <div class="tbl" id="tbl"></div>
  <svg id="fb"></svg>
  <div class="row">
    <button id="next" class="hide">Ещё круг</button>
    <button id="hint" class="ghost">💡 Подсказка</button>
    <button id="play" class="ghost" title="сыграть всё, что стоит">▶</button>
    <button id="fl" class="ghost" title="вспышка на весь экран при верном ходе">✨</button>
    <div class="stat" id="stat"></div>
  </div>
</div>
<script>
'use strict';
// --- музыка -------------------------------------------------------------
var OPEN=[40,45,50,55,59,64];          // струны 6,5,4,3,2,1 (индекс 0 = 6-я, самая толстая); главы 1–4 берут первые четыре, «GB» все шесть
var OPEN7=35;                           // призрачная 7-я струна под 6-й: си, как на семиструнке, та же нота, что 2-я, на две октавы ниже
var MINOR=[0,2,3,5,7,8,10];             // натуральный минор от тоники
var NAMES=['до','до♯','ре','ре♯','ми','фа','фа♯','соль','соль♯','ля','ля♯','си'];
var MINOR_NAME=['до минор','до-диез минор','ре минор','ми-бемоль минор','ми минор','фа минор','фа-диез минор','соль минор','соль-диез минор','ля минор','си-бемоль минор','си минор'];
function midi(s,f){return (s<0?OPEN7:OPEN[s])+f}
function mod12(x){return((x%12)+12)%12}
function inScale(m){return MINOR.indexOf(mod12(m-R.tonicPc))>=0}
// палка: три соседние ноты гаммы на струне s, начиная с лада a
function palka(s,a){var fr=[a],f=a;while(fr.length<3){f++;if(inScale(midi(s,f)))fr.push(f)}return fr}
function shapeOf(fr){var d=(fr[1]-fr[0])+''+(fr[2]-fr[1]);return d==='21'?'R':d==='22'?'W':'L'}
var DOTS={R:'●·●●',W:'●·●·●',L:'●●·●'};
function shapeByNum(n){return n<=2?'R':n<=5?'W':'L'}   // проверено перебором 12 тональностей: 1 и 2 R, 3 4 5 W, 6 и 7 L
// имя палки относительно дома (слово Влада 29.09.2026 06:03: «от ля в миноре палка красная, а дальше оранжевая и т.д., индикация от ля один, от ре два, относительно»):
// номер = место в стенке от тоники вверх по струнам, то есть по квартам (ля 1, ре 2, соль 3, до 4, фа 5, си 6, ми 7); цвет радуги по номеру
var RAINBOW=['#ff5a5a','#ff9a3c','#ffd93c','#5fdc7a','#4fb8ff','#7c8cff','#c77dff'];
function degOf(s,f){return MINOR.indexOf(mod12(midi(s,f)-R.tonicPc))}
function pnum(s,f){return (degOf(s,f)*5)%7+1}
function pname(s,f){return String(pnum(s,f))}   // только цифра (слово Влада 06:23: «убери из названий палок буквы, только цифры оставь»)
function pcol(s,f){return RAINBOW[pnum(s,f)-1]}

// --- звук (как в большом боксе: айфон будится касанием) ----------------------------------------
var AC=null,KEEP=null;
function ac(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();return AC}
function silentWav(){var sr=8000,n=sr/2,buf=new ArrayBuffer(44+n),v=new DataView(buf),i;
  function w(o,s){for(i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))}
  w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);
  for(i=0;i<n;i++)v.setUint8(44+i,128);return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}))}
function unlock(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  try{var c=ac();if(c.state!=='running')c.resume()}catch(e){}
  try{if(!KEEP){KEEP=document.createElement('audio');KEEP.src=silentWav();KEEP.loop=true;KEEP.setAttribute('playsinline','');KEEP.volume=0.01}
    if(KEEP.paused){var p=KEEP.play();if(p&&p.catch)p.catch(function(){})}}catch(e){}}
['touchstart','pointerdown','mousedown','keydown'].forEach(function(ev){document.addEventListener(ev,unlock,{capture:true,passive:true})});
function pluck(m,when){try{var c=ac(),t=c.currentTime+(when||0)+.01,f0=440*Math.pow(2,(m-69)/12);
  var o=c.createOscillator(),o2=c.createOscillator(),lp=c.createBiquadFilter(),g=c.createGain();
  o.type='sawtooth';o.frequency.value=f0;o2.type='triangle';o2.frequency.value=f0*2.003;
  lp.type='lowpass';lp.frequency.setValueAtTime(Math.min(9000,f0*9),t);lp.frequency.exponentialRampToValueAtTime(Math.max(300,f0*1.5),t+.6);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(.35,t+.006);g.gain.exponentialRampToValueAtTime(.001,t+1.3);
  o.connect(lp);o2.connect(lp);lp.connect(g);g.connect(c.destination);o.start(t);o2.start(t);o.stop(t+1.4);o2.stop(t+1.4)}catch(e){}}

// --- уроки ---------------------------------------------------------------
// главы (ch); st это механика урока: 1 стенка от тоники, 2 соседка вбок, 4 лесенка вверх со сдвигами, 5 рамка на ноту вбок (тащится пальцем).
// w: номер урока стенки; dir: +1 вправо, -1 влево, 0 случайно; blind: без цифр, таблицы и подсказки; ns: сколько струн
var CH=[{t:'Стенка',f:'Стенка',m:'↑↓'},{t:'Вправо',f:'Вправо',m:'→'},{t:'Влево',f:'Влево',m:'←'},{t:'Транс',f:'Трансформация',m:'⇒ нота'},{t:'Искл.',f:'Исключения',m:'5↗6 GB'}];
var LEVELS=[
  {id:'dom',ch:0,st:1,w:0,t:'Дом',     sub:'палка тоники'},
  {id:'sv', ch:0,st:1,w:1,t:'Сверху',  sub:'сосед выше'},
  {id:'sn', ch:0,st:1,w:2,t:'Снизу',   sub:'сосед ниже'},
  {id:'st', ch:0,st:1,w:3,t:'Стенка',  sub:'4 струны'},
  {id:'sb', ch:0,st:1,w:4,t:'Вслепую', sub:'без подсказок',blind:true},
  {id:'r',  ch:1,st:2,t:'Справа',  sub:'соседи вправо',dir:1},
  {id:'rb', ch:1,st:2,t:'Вслепую', sub:'только вправо',dir:1,blind:true},
  {id:'l',  ch:2,st:2,t:'Слева',   sub:'соседи влево',dir:-1},
  {id:'lb', ch:2,st:2,t:'Вслепую', sub:'обе стороны',dir:0,blind:true},
  {id:'tr', ch:3,st:5,t:'⇒ нота',  sub:'рамка вправо',dir:1},
  {id:'tl', ch:3,st:5,t:'⇐ нота',  sub:'рамка влево',dir:-1},
  {id:'tb', ch:3,st:5,t:'Вслепую', sub:'обе стороны',dir:0,blind:true},
  {id:'s56',ch:4,st:4,t:'5 ↗ 6',   sub:'4 струны'},
  {id:'gb', ch:4,st:4,t:'GB',      sub:'6 струн',ns:6},
  {id:'s4b',ch:4,st:4,t:'Вслепую', sub:'6 струн',ns:6,blind:true}];
var OLD_IDS=['dom','sv','sn','st','sb','r','l','lb'];   // порядок уроков до глав: прогресс из boxLearn1 переезжает по этим именам
var NEED=3;  // чистых кругов (без ошибок и без подсказки), чтобы открыть следующий урок
var P=load();
function load(){var d=null,i;try{d=JSON.parse(localStorage.getItem('boxLearn2'))}catch(e){}
  if(!d){d={clean:{},open:{}};var o=null;try{o=JSON.parse(localStorage.getItem('boxLearn1'))}catch(e){}
    if(o){(o.clean||[]).forEach(function(n,j){if(OLD_IDS[j])d.clean[OLD_IDS[j]]=n});for(i=0;i<(o.open||1)&&i<OLD_IDS.length;i++)d.open[OLD_IDS[i]]=1}}
  d.clean=d.clean||{};d.open=d.open||{};d.open.dom=1;
  for(i=1;i<LEVELS.length;i++)if((d.clean[LEVELS[i-1].id]||0)>=NEED)d.open[LEVELS[i].id]=1;
  // ?all открывает все уроки разом и запоминает (слово Влада 01.10.2026 17:59: «Открой все главы сразу мне»)
  if(/[?&]all\b/.test(location.search)){LEVELS.forEach(function(L){d.open[L.id]=1});try{localStorage.setItem('boxLearn2',JSON.stringify(d))}catch(e){}}
  return d}

   '<div class="map small">'+obAnim(-1)+'</div>',
   'Соседка слева это та же палка, что струной ниже, только на 5 ладов левее: она поднимается по диагонали. Под 6-й струной ничего нет, поэтому в уроке там нарисована призрачная 7-я: на семиструнке это си, та же, что 2-я.',
   'Вплотную слева только у 4 и 5, у остальных между палками пустой лад.']},
  {h:'Обе стороны',p:['Последний урок главы без цифр, без таблицы и без призрачной струны: сторона выпадает случайно, вправо или влево. Держи в голове одно: вправо гамма вперёд, влево назад, и где полутон.']}],
 [{h:'Глава 4 · Трансформация',p:['Те же ноты можно резать на тройки иначе. Сдвинь рамку на одну ноту, и палка превращается в другую: в каждой палке уже лежит соседняя.',
   '<div class="scrl">↔ тащи вбок: рамка едет на ноту</div><div class="map plane" data-plane="shift"></div>',
   'Ноты на месте, меняются только рамки. Знак «равно со стрелкой»: <b>1 ⇒ 6</b> читается «1, сдвинутая вправо, это 6». Влево результат пишется с той стороны, куда уехала рамка: <b>3 ⇐ 1</b>.']},
  {h:'Правило',p:['Рамка вправо на ноту: номер минус 2. Влево: плюс 2. По кругу, после 7 снова 1. Две ноты остаются общими, третья новая.',
   chips([1,6,4,2]),
   'В уроке рамку тащишь пальцем по струне: она липнет к нотам гаммы, прилипла к нужной, значит засчитано. Три шага по ноте, и рамка встала ровно на соседку: справа номер на один больше, слева на один меньше.']}],
 [{h:'Глава 5 · Исключения',p:['Вся метода стоит на правилах из прошлых глав. Исключений из них ровно два, оба про сдвиг вверх по струнам. Первое: от 5 к 6 палка уезжает на лад вправо, по диагонали.',
   '<div class="map small">'+obSvg([0,1],0,6,[[0,1],[1,2]])+'</div>',
   'Почему: от 5 до 6 в гамме не кварта, а тритон, на полтона шире. Струна на это не настроена, вот палка и съезжает. Вниз наоборот: от 6 к 5 на лад влево.']},
  {h:'Исключение 2 · GB',p:['Все струны настроены по квартам, кроме одной пары: между 3-й (G) и 2-й (B) терция, на полтона уже. Поэтому с 3-й на 2-ю вся палка уезжает на лад вправо.',
   '<div class="map small">'+obSvg([3,4],1,7,[[3,2],[4,3]])+'</div>',
   'Если на стыке GB попалось ещё и 5 → 6, оба сдвига складываются: на два лада вправо. На грифе этот стык помечен жёлтой строкой GB.']},
  {h:'Вот и вся метода',p:['Внизу стоит палка, строй вверх по одной на струну: продолжай гамму. Сначала на четырёх струнах, потом на всех шести.','Тоника, семь палок, вверх +1, вправо +1, рамка на ноту ⇒ минус 2, и два исключения: 5 → 6 и GB. Больше учить нечего, остальное гриф вычисляет сам.']}]];
var OB=OBCH[0],OBC=0;
var obI=0;
function obShow(i){obI=i;var c=OB[i],el=document.getElementById('obc');
  el.innerHTML='<h2>'+c.h+'</h2>'+c.p.map(function(x){return x.charAt(0)==='<'?x:'<p>'+x+'</p>'}).join('')+
   '<div class="nav">'+(i>0?'<button class="ghost" id="obb">Назад</button>':'<button class="ghost" id="obs">Пропустить</button>')+
   '<button id="obn">'+(i<OB.length-1?'Дальше':'Поехали')+'</button><span class="dots">'+(i+1)+' / '+OB.length+'</span></div>';
  document.getElementById('ob').classList.remove('hide');
  el.querySelectorAll('.map.plane').forEach(function(b){obPlane(b,b.dataset.plane)});
  document.getElementById('obn').onclick=function(){if(obI<OB.length-1)obShow(obI+1);else obClose()};
  var b=document.getElementById('obb');if(b)b.onclick=function(){obShow(obI-1)};
  var sk=document.getElementById('obs');if(sk)sk.onclick=obClose}
// какие вступления уже видены. Ключ сменён 02.10.2026 (boxLearnObCh3): вступления переписаны, их надо показать заново
function obSeenList(){var a=[];try{a=JSON.parse(localStorage.getItem('boxLearnObCh3'))||[]}catch(e){}return a}
function obShowCh(c){OB=OBCH[c];OBC=c;obShow(0)}
function obClose(){document.getElementById('ob').classList.add('hide');var a=obSeenList();if(a.indexOf(OBC)<0)a.push(OBC);try{localStorage.setItem('boxLearnObCh3',JSON.stringify(a))}catch(e){}}
function goChapter(c){newRound(lastOpenIn(c));if(obSeenList().indexOf(c)<0)obShowCh(c)}
document.getElementById('help').onclick=function(){obShowCh(R.L.ch)};
if(obSeenList().indexOf(0)<0)obShowCh(0);
</script>
